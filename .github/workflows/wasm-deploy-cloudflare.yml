name: Deploy the Sage.js browser application

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: WebAssembly release run with successful browser product acceptance
        required: true
        type: string
      qualification_run_id:
        description: Same-SHA CI run with successful native product acceptance and numerical gate
        required: true
        type: string
      target:
        description: Cloudflare Worker and R2 deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      preview_name:
        description: Lowercase preview alias (ignored for production)
        required: false
        default: candidate
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sagejs-app-${{ inputs.target }}
  cancel-in-progress: ${{ inputs.target == 'preview' }}

jobs:
  deploy:
    name: Receipt-authenticated Cloudflare Worker ${{ inputs.target }} deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: sagejs-app-${{ inputs.target }}
      url: ${{ inputs.target == 'production' && vars.SAGEJS_PUBLIC_ORIGIN || steps.deploy.outputs.deployment-url }}
    steps:
      - name: Check out the product acceptance control
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: build/input-control
          sparse-checkout: scripts/release
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1

      - name: Validate both product acceptance gates
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          TARGET: ${{ inputs.target }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
        run: |
          set -euo pipefail
          node build/input-control/scripts/release/deployment-inputs.cjs > "$RUNNER_TEMP/sagejs-deployment-inputs.json"
          echo "sha=$(jq -r .sourceRevision "$RUNNER_TEMP/sagejs-deployment-inputs.json")" >>"$GITHUB_OUTPUT"
          echo "branch=$(jq -r .branch "$RUNNER_TEMP/sagejs-deployment-inputs.json")" >>"$GITHUB_OUTPUT"

      - name: Check out exactly the validated source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          submodules: recursive
          fetch-depth: 0

      - name: Check out the deployment control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: build/deployment-control
          sparse-checkout: |
            .github/workflows/wasm-candidate.yml
            .github/workflows/wasm-deploy-cloudflare.yml
            docs/webassembly-cloudflare-deployment.md
            packages/flint-wasm/scripts/browser-wasm-deployment.cjs
            test/wasm-deployment-workflow.cjs
            scripts/release/deployment-inputs.cjs
            scripts/release/product-acceptance.cjs
            website/live/cloudflare
            website/live/test/cloudflare-deployment.test.mjs
          sparse-checkout-cone-mode: false

      - name: Require production deployments to come from main
        if: inputs.target == 'production'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "Production deployment source $SOURCE_SHA is not reachable from origin/main" >&2
            exit 1
          }

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install the exact staging dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail closed when Cloudflare configuration is absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SAGEJS_PUBLIC_ORIGIN: ${{ vars.SAGEJS_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "Invalid CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [[ "$CLOUDFLARE_WORKER_NAME" =~ ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$ ]] || {
            echo "Missing or invalid CLOUDFLARE_WORKER_NAME" >&2
            exit 1
          }
          [[ "$R2_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || {
            echo "Missing or invalid R2_BUCKET_NAME" >&2
            exit 1
          }
          [[ -n "$R2_ACCESS_KEY_ID" ]] || { echo "Missing R2_ACCESS_KEY_ID" >&2; exit 1; }
          [[ -n "$R2_SECRET_ACCESS_KEY" ]] || { echo "Missing R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          [[ "$SAGEJS_PUBLIC_ORIGIN" == "https://app.sagejs.org" ]] || {
            echo "Missing or invalid SAGEJS_PUBLIC_ORIGIN" >&2
            exit 1
          }

      - name: Download the reproducible production artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GH_REPO" \
            --name wasm-clean-build-a \
            --dir build/prebuilt
          test -f build/prebuilt/packages/flint-wasm/dist/production-manifest.json
          test -f build/prebuilt/packages/flint-wasm/dist/build-receipt.json
          rm -rf packages/flint-wasm/dist
          cp -a build/prebuilt/packages/flint-wasm/dist packages/flint-wasm/dist

      - name: Rebuild and authenticate the same-candidate numerical release gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          gh run download "$QUALIFICATION_RUN_ID" \
            --repo "$GH_REPO" \
            --name numerical-release-gate \
            --dir build/validated-numerical-gate
          gh run download "$QUALIFICATION_RUN_ID" \
            --repo "$GH_REPO" \
            --name numerical-release-evidence \
            --dir build/numerical-qualification
          pnpm release:qualify:numerics:gate -- \
            --candidate "$SOURCE_SHA" \
            --input build/numerical-qualification \
            --output build/numerical-qualification/gate
          pnpm release:qualify:numerics:authenticate -- \
            --candidate "$SOURCE_SHA" \
            --gate build/validated-numerical-gate/release-gate.json \
            --rebuilt-gate build/numerical-qualification/gate/release-gate.json \
            --browser-distribution packages/flint-wasm/dist

      - name: Verify the receipt and stage the credential-free application
        run: |
          set -euo pipefail
          node packages/flint-wasm/scripts/production-receipt.cjs validate
          node website/live/scripts/stage.mjs
          node packages/flint-wasm/scripts/browser-wasm-deployment.cjs \
            --headers website/live/dist/_headers
          node --test website/live/test/*.test.mjs
          node --test test/wasm-deployment-workflow.cjs
          node --test build/deployment-control/website/live/test/cloudflare-deployment.test.mjs
          node --test build/deployment-control/test/wasm-deployment-workflow.cjs
          test -f website/live/dist/runtime-version.json
          test -f website/live/dist/asset-manifest.json

      - name: Prepare immutable identity and Brotli R2 objects
        id: prepare
        env:
          TARGET: ${{ inputs.target }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          SAGEJS_PUBLIC_ORIGIN: ${{ vars.SAGEJS_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          node build/deployment-control/website/live/cloudflare/prepare-release.mjs \
            --site website/live/dist \
            --output build/cloudflare-deploy \
            --target "$TARGET" \
            --preview-name "$PREVIEW_NAME" \
            --worker-name "$CLOUDFLARE_WORKER_NAME" \
            --bucket "$R2_BUCKET_NAME" \
            --public-origin "$SAGEJS_PUBLIC_ORIGIN"
          node build/deployment-control/website/live/cloudflare/upload-r2.mjs \
            --deployment build/cloudflare-deploy/deployment.json \
            --verify-only
          printf '%s\n' "$GITHUB_SHA" > build/cloudflare-deploy/deployment-control.sha
          echo "release=$(jq -r .release build/cloudflare-deploy/deployment.json)" >>"$GITHUB_OUTPUT"
          echo "worker=$(jq -r .name build/cloudflare-deploy/wrangler.json)" >>"$GITHUB_OUTPUT"

      - name: Upload the prepared release to the private R2 bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          node build/deployment-control/website/live/cloudflare/upload-r2.mjs \
            --deployment build/cloudflare-deploy/deployment.json

      - name: Preserve the exact staged site as a deployment receipt
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-app-${{ inputs.target }}-${{ steps.source.outputs.sha }}
          path: website/live/dist
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the R2 publication manifest
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-r2-${{ inputs.target }}-${{ steps.source.outputs.sha }}
          path: |
            build/cloudflare-deploy/deployment.json
            build/cloudflare-deploy/deployment-control.sha
            build/cloudflare-deploy/wrangler.json
            build/cloudflare-deploy/worker.mjs
          if-no-files-found: error
          retention-days: 90

      - name: Isolate the Wrangler installation from the pnpm workspace
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          await writeFile(
            "build/cloudflare-deploy/package.json",
            `${JSON.stringify({ private: true })}\n`,
          );
          NODE

      - name: Recheck selected product attempts before activation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          TARGET: ${{ inputs.target }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
        run: node build/deployment-control/scripts/release/deployment-inputs.cjs --recheck "$RUNNER_TEMP/sagejs-deployment-inputs.json"

      - name: Atomically activate the uploaded release with a Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: build/cloudflare-deploy
          packageManager: npm
          wranglerVersion: "4.125.0"
          command: deploy --config wrangler.json

      - name: Validate the deployed preview origin
        if: inputs.target == 'preview'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_URL" =~ ^https://[a-z0-9.-]+\.workers\.dev/?$ ]] || {
            echo "Cloudflare returned an unexpected preview URL" >&2
            exit 1
          }
          node build/deployment-control/packages/flint-wasm/scripts/browser-wasm-deployment.cjs \
            --headers website/live/_headers \
            --origin "$DEPLOYMENT_URL" \
            --expected-runtime website/live/dist/runtime-version.json

      - name: Validate app.sagejs.org after production deployment
        if: inputs.target == 'production'
        env:
          SAGEJS_PUBLIC_ORIGIN: ${{ vars.SAGEJS_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node build/deployment-control/packages/flint-wasm/scripts/browser-wasm-deployment.cjs \
              --headers website/live/_headers \
              --origin "$SAGEJS_PUBLIC_ORIGIN" \
              --expected-runtime website/live/dist/runtime-version.json
            then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Production origin did not validate after 12 attempts" >&2
              exit 1
            fi
            echo "Production origin is not ready; retrying in 10 seconds ($attempt/12)" >&2
            sleep 10
          done
