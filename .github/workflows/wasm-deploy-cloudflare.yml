name: Deploy the Sage.js browser application

on:
  workflow_dispatch:
    inputs:
      prepared_request:
        description: Frozen browser request JSON (source identity and handoff run/attempt/artifact/control SHA)
        required: true
        type: string
      target:
        description: Cloudflare Worker and R2 deployment target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      preview_name:
        description: Lowercase preview alias (ignored for production)
        required: false
        default: candidate
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sagejs-app-${{ inputs.target }}
  cancel-in-progress: ${{ inputs.target == 'preview' }}

jobs:
  deploy:
    name: Receipt-authenticated Cloudflare Worker ${{ inputs.target }} deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: sagejs-app-${{ inputs.target }}
      url: ${{ inputs.target == 'production' && vars.SAGEJS_PUBLIC_ORIGIN || steps.deploy.outputs.deployment-url }}
    defaults:
      run:
        working-directory: candidate
    steps:
      - name: Check out the deployment control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: control
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          package_json_file: control/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm
          cache-dependency-path: control/pnpm-lock.yaml

      - name: Install control dependencies without product builds
        working-directory: control
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate frozen browser request
        id: source
        working-directory: control
        env:
          SAGEJS_BROWSER_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          node scripts/release/prepare-browser-deployment.cjs admit > "$RUNNER_TEMP/sagejs-browser-request.json"
          echo "sha=$(jq -r .sourceRevision "$RUNNER_TEMP/sagejs-browser-request.json")" >>"$GITHUB_OUTPUT"

      - name: Check out exactly the validated source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: candidate
          submodules: recursive
          fetch-depth: 0

      - name: Require production deployments to come from main
        if: inputs.target == 'production'
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "Production deployment source $SOURCE_SHA is not reachable from origin/main" >&2
            exit 1
          }

      - name: Fail closed when Cloudflare configuration is absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SAGEJS_PUBLIC_ORIGIN: ${{ vars.SAGEJS_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-f0-9]{32}$ ]] || { echo "Invalid CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          [[ "$CLOUDFLARE_WORKER_NAME" =~ ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]$ ]] || {
            echo "Missing or invalid CLOUDFLARE_WORKER_NAME" >&2
            exit 1
          }
          [[ "$R2_BUCKET_NAME" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || {
            echo "Missing or invalid R2_BUCKET_NAME" >&2
            exit 1
          }
          [[ -n "$R2_ACCESS_KEY_ID" ]] || { echo "Missing R2_ACCESS_KEY_ID" >&2; exit 1; }
          [[ -n "$R2_SECRET_ACCESS_KEY" ]] || { echo "Missing R2_SECRET_ACCESS_KEY" >&2; exit 1; }
          [[ "$SAGEJS_PUBLIC_ORIGIN" == "https://app.sagejs.org" ]] || {
            echo "Missing or invalid SAGEJS_PUBLIC_ORIGIN" >&2
            exit 1
          }

      - name: Prepare the frozen browser artifact set
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
          SAGEJS_BROWSER_INPUTS: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sagejs-browser-artifacts"
          node scripts/release/prepare-browser-deployment.cjs prepare \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/sagejs-browser-artifacts"

      - name: Install the exact staging dependencies without lifecycle builds
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the receipt and stage the credential-free application
        run: |
          set -euo pipefail
          node packages/flint-wasm/scripts/production-receipt.cjs validate
          node website/live/scripts/stage.mjs
          node packages/flint-wasm/scripts/browser-wasm-deployment.cjs \
            --headers website/live/dist/_headers
          node --test website/live/test/*.test.mjs
          node --test ../control/website/live/test/cloudflare-deployment.test.mjs
          node --test ../control/test/wasm-deployment-workflow.cjs
          test -f website/live/dist/runtime-version.json
          test -f website/live/dist/asset-manifest.json

      - name: Prepare immutable identity and Brotli R2 objects
        id: prepare
        env:
          TARGET: ${{ inputs.target }}
          PREVIEW_NAME: ${{ inputs.preview_name }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          SAGEJS_PUBLIC_ORIGIN: ${{ vars.SAGEJS_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          node ../control/website/live/cloudflare/prepare-release.mjs \
            --site website/live/dist \
            --output build/cloudflare-deploy \
            --target "$TARGET" \
            --preview-name "$PREVIEW_NAME" \
            --worker-name "$CLOUDFLARE_WORKER_NAME" \
            --bucket "$R2_BUCKET_NAME" \
            --public-origin "$SAGEJS_PUBLIC_ORIGIN"
          node ../control/website/live/cloudflare/upload-r2.mjs \
            --deployment build/cloudflare-deploy/deployment.json \
            --verify-only
          printf '%s\n' "$GITHUB_SHA" > build/cloudflare-deploy/deployment-control.sha
          echo "release=$(jq -r .release build/cloudflare-deploy/deployment.json)" >>"$GITHUB_OUTPUT"
          echo "worker=$(jq -r .name build/cloudflare-deploy/wrangler.json)" >>"$GITHUB_OUTPUT"

      - name: Upload the prepared release to the private R2 bucket
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          node ../control/website/live/cloudflare/upload-r2.mjs \
            --deployment build/cloudflare-deploy/deployment.json

      - name: Preserve the exact staged site as a deployment receipt
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-app-${{ inputs.target }}-${{ steps.source.outputs.sha }}
          path: candidate/website/live/dist
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the R2 publication manifest
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-r2-${{ inputs.target }}-${{ steps.source.outputs.sha }}
          path: |
            candidate/build/cloudflare-deploy/deployment.json
            candidate/build/cloudflare-deploy/deployment-control.sha
            candidate/build/cloudflare-deploy/wrangler.json
            candidate/build/cloudflare-deploy/worker.mjs
          if-no-files-found: error
          retention-days: 90

      - name: Isolate the Wrangler installation from the pnpm workspace
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          await writeFile(
            "build/cloudflare-deploy/package.json",
            `${JSON.stringify({ private: true })}\n`,
          );
          NODE

      - name: Recheck frozen browser bytes before activation
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
          SAGEJS_BROWSER_INPUTS: ${{ toJSON(inputs) }}
        run: node scripts/release/prepare-browser-deployment.cjs recheck "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/sagejs-browser-artifacts"

      - name: Atomically activate the uploaded release with a Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: candidate/build/cloudflare-deploy
          packageManager: npm
          wranglerVersion: "4.125.0"
          command: deploy --config wrangler.json

      - name: Validate the deployed preview origin
        if: inputs.target == 'preview'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_URL" =~ ^https://[a-z0-9.-]+\.workers\.dev/?$ ]] || {
            echo "Cloudflare returned an unexpected preview URL" >&2
            exit 1
          }
          node ../control/packages/flint-wasm/scripts/browser-wasm-deployment.cjs \
            --headers website/live/_headers \
            --origin "$DEPLOYMENT_URL" \
            --expected-runtime website/live/dist/runtime-version.json

      - name: Validate app.sagejs.org after production deployment
        if: inputs.target == 'production'
        env:
          SAGEJS_PUBLIC_ORIGIN: ${{ vars.SAGEJS_PUBLIC_ORIGIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if node ../control/packages/flint-wasm/scripts/browser-wasm-deployment.cjs \
              --headers website/live/_headers \
              --origin "$SAGEJS_PUBLIC_ORIGIN" \
              --expected-runtime website/live/dist/runtime-version.json
            then
              exit 0
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "Production origin did not validate after 12 attempts" >&2
              exit 1
            fi
            echo "Production origin is not ready; retrying in 10 seconds ($attempt/12)" >&2
            sleep 10
          done

      - name: Preserve browser preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-app-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sagejs-browser-request.json
            ${{ runner.temp }}/sagejs-browser-artifacts/prepared-browser.json
            candidate/build/release-runner/**/*.json
            candidate/build/release-runner/**/*.log
          if-no-files-found: warn
          retention-days: 90
