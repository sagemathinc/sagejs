name: Sage.js CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      platform_smoke:
        description: Run the Linux arm64, macOS arm64, and Windows x64 smoke matrix
        required: false
        default: false
        type: boolean
      native_targets:
        description: Comma-separated full native targets, or all
        required: false
        default: all
        type: string
      recovery_run_id:
        description: Completed tagged CI run whose original publish job should be rerun
        required: false
        default: ""
        type: string
      recovery_tag:
        description: Immutable release tag built by recovery_run_id
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: sagejs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  routine:
    name: Routine gate (Linux x64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.recovery_run_id == '' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run bounded routine validation
        run: pnpm test:ci

      - name: Install the minimum supported Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - name: Verify minimum-runtime SQLite compatibility
        run: node --test test/sqlite-minimum-node.cjs

  numerical-product:
    name: Canonical authenticated numerical runtime
    needs: routine
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.platform_smoke) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the exact source candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - id: toolchain
        run: |
          path="$(node packages/wasm-toolchain/scripts/toolchain.cjs cache-path)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "identity=${path##*/}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.path }}
          key: sagejs-wasm-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}

      - name: Build and bind the canonical numerical runtime
        run: |
          node packages/wasm-toolchain/scripts/toolchain.cjs prepare
          node packages/wasm-toolchain/scripts/probe.cjs
          node packages/flint-wasm/numerical/scripts/build-all.cjs
          node scripts/numerical-product.cjs publish \
            --output build/authenticated-numerical-product

      - name: Require source-current qualified NLopt for a tagged product
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          node
          src/lib/sagejs/numerics/optimization/backends/nlopt/scripts/verify-release.cjs
          --require-qualified

      - name: Preserve the exact source-bound numerical runtime
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-numerical-product
          overwrite: true
          path: build/authenticated-numerical-product
          if-no-files-found: error
          retention-days: 14

  platform-smoke:
    name: Platform smoke (${{ matrix.target }})
    needs: routine
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.platform_smoke) }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: linux-arm64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
          - target: macos-arm64
            runner: blacksmith-6vcpu-macos-15
          - target: windows-x64
            runner: blacksmith-8vcpu-windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CI: "true"

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install Python for Windows compiler helpers
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build the compiler and runtime
        run: pnpm build

      - name: Execute the resident exact cross-platform witness
        run: node --test --test-name-pattern "Magma authenticates|generic resident exact ownership graph" test/native-rank-four-lattice-workspace.cjs

      - name: Enforce the startup budget
        run: pnpm test:startup:run

      - name: Run platform-sensitive smoke tests
        run: pnpm test:platform

  linux-x64:
    name: Linux x64 native, tests, and SEA
    needs: [routine, numerical-product]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.platform_smoke && (inputs.native_targets == 'all' || contains(inputs.native_targets, 'linux-x64'))) || github.event_name == 'schedule' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 150
    env:
      SAGEJS_NATIVE_PREBUILT_REQUIRED: "1"
      SAGEJS_NUMERICAL_PRODUCT_ROOT: ${{ github.workspace }}/build/authenticated-numerical-product
      SAGEJS_NUMERICAL_RUNTIME_REQUIRED: "1"

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake python3 python3-jupyter-client m4 xz-utils

      - name: Cache downloaded and compiled arithmetic dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: linux-x64-flint-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: |
            linux-x64-flint-
            linux-x64-native-

      - name: Cache downloaded and compiled graph dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/graph/.native/downloads
            packages/graph/.native/prefix
          key: linux-x64-graph-${{ hashFiles('packages/graph/scripts/build-deps.cjs', 'packages/graph/package.json') }}
          restore-keys: linux-x64-graph-

      - name: Cache downloaded and compiled FFLAS dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/fflas/.native/downloads
            packages/fflas/.native/prefix
          key: linux-x64-fflas-${{ hashFiles('packages/fflas/scripts/build-deps.cjs', 'packages/fflas/scripts/native-prefix.cjs', 'packages/fflas/package.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: linux-x64-fflas-

      - name: Restore the canonical authenticated numerical runtime
        uses: actions/download-artifact@v8
        with:
          name: sagejs-numerical-product
          path: build/authenticated-numerical-product

      - name: Bootstrap the complete native system
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm bootstrap

      - name: Execute the resident exact native witness
        run: node --test test/native-rank-four-lattice-workspace.cjs

      - name: Enforce the development startup budget
        run: pnpm test:startup:run

      - name: Run strict baselib checks
        run: pnpm test:baselib:strict

      - name: Run compiler compatibility diagnostics
        id: compiler
        run: |
          set +e
          pnpm test:compiler
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            result="passed"
          else
            result="known failures (exit $status)"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Run unit, host integration, and native tests
        run: |
          pnpm test:unit
          pnpm test:integration:run
          pnpm test:native:run
          pnpm --dir packages/flint test:eclib:corpus
          pnpm test:installer
          pnpm test:release

      - name: Verify generated reference and imported Sage examples
        run: |
          pnpm docs:verify
          git diff --exit-code -- \
            docs/reference/api.md \
            website/reference.html \
            website/reference-data.json \
            website/reference-results.json
          pnpm test:upstream:run

      - name: Run Sage tutorial compatibility diagnostics
        id: tutorial
        run: |
          set +e
          pnpm test:tutorial
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            result="passed"
          else
            result="known failures (exit $status)"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Build and relocation-test both SEA executables
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm test:sea:reuse

      - name: Exercise the SEA Jupyter wire protocol
        run: pnpm test:jupyter:sea

      - name: Record non-blocking compatibility status
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Compatibility diagnostics

          | Suite | Outcome |
          | --- | --- |
          | Compiler corpus | **${{ steps.compiler.outputs.result }}** |
          | Sage tutorial | **${{ steps.tutorial.outputs.result }}** |

          These broad compatibility suites already contain failures on the
          baseline that introduced CI. They remain visible and non-blocking
          while those existing failures are triaged; bootstrap, strict baselib,
          unit, host integration, native, and SEA tests are blocking.
          EOF

      - name: Validate tagged release metadata and installer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm test:release -- --tag "$GITHUB_REF_NAME"
          pnpm test:installer

      - name: Package the Linux x64 SEA distribution
        run: |
          mkdir -p build/release/sagejs-linux-x64/licenses
          cp build/sea/sagejs build/sea/sagepython build/release/sagejs-linux-x64/
          cp LICENSE README.md DISTRIBUTION.md build/release/sagejs-linux-x64/
          cp licenses/* build/release/sagejs-linux-x64/licenses/
          tar -C build/release -cJf build/release/sagejs-linux-x64.tar.xz sagejs-linux-x64
          cd build/release
          sha256sum sagejs-linux-x64.tar.xz > sagejs-linux-x64.tar.xz.sha256

      - name: Package Linux x64 for npm and the shell installer
        run: |
          pnpm package:native-npm linux-x64 build/sea/sagejs build/sea/sagepython
          SAGEJS_SKIP_PREPACK=1 pnpm pack --out build/release/npm/sagejs.tgz
          pnpm test:npm-package
          cp install.sh build/release/install.sh

      - name: Cache authenticated numerical oracle inputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache@v6
        with:
          path: build/numerical-scipy-downloads
          key: numerical-scipy-linux-x64-${{ hashFiles('bench/numerical-computing/qualification/scipy-oracle-catalog.json') }}

      - name: Provision the hermetic numerical oracle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build/numerical-scipy-downloads build/numerical-scipy
          pnpm release:qualify:numerics:oracle -- \
            --artifact-directory build/numerical-scipy-downloads \
            --prefix build/numerical-scipy/prefix \
            --provenance build/numerical-scipy/provenance.json \
            --download
          echo "SAGEJS_QUALIFICATION_SCIPY_PREFIX=$(pwd)/build/numerical-scipy/prefix" >> "$GITHUB_ENV"
          echo "SAGEJS_QUALIFICATION_SCIPY_PROVENANCE=$(pwd)/build/numerical-scipy/provenance.json" >> "$GITHUB_ENV"

      - name: Collect exact Linux x64 numerical product rows
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm release:qualify:numerics:platform -- \
            --candidate "$(git rev-parse HEAD)" \
            --root-archive build/release/npm/sagejs.tgz \
            --platform-archive build/release/npm/sagejs-linux-x64.tgz \
            --sea-executable build/sea/sagejs \
            --output build/numerical-qualification/platform/linux-x64

      - name: Upload Linux x64 numerical qualification
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: numerical-qualification-linux-x64
          overwrite: true
          path: build/numerical-qualification/platform/linux-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux x64 SEA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-linux-x64
          overwrite: true
          path: |
            build/release/sagejs-linux-x64.tar.xz
            build/release/sagejs-linux-x64.tar.xz.sha256
            build/release/install.sh
            build/release/npm/sagejs.tgz
            build/release/npm/sagejs-linux-x64.tgz
          if-no-files-found: error
          retention-days: 14

  linux-arm64:
    name: Linux arm64 native, tests, and SEA
    needs: [routine, numerical-product]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.platform_smoke && (inputs.native_targets == 'all' || contains(inputs.native_targets, 'linux-arm64'))) || github.event_name == 'schedule' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 150
    env:
      SAGEJS_NATIVE_PREBUILT_REQUIRED: "1"
      SAGEJS_NUMERICAL_PRODUCT_ROOT: ${{ github.workspace }}/build/authenticated-numerical-product
      SAGEJS_NUMERICAL_RUNTIME_REQUIRED: "1"

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake python3 m4 xz-utils

      - name: Cache downloaded and compiled arithmetic dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: linux-arm64-flint-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: |
            linux-arm64-flint-
            linux-arm64-native-

      - name: Cache downloaded and compiled graph dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/graph/.native/downloads
            packages/graph/.native/prefix
          key: linux-arm64-graph-${{ hashFiles('packages/graph/scripts/build-deps.cjs', 'packages/graph/package.json') }}
          restore-keys: linux-arm64-graph-

      - name: Cache downloaded and compiled FFLAS dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/fflas/.native/downloads
            packages/fflas/.native/prefix
          key: linux-arm64-fflas-${{ hashFiles('packages/fflas/scripts/build-deps.cjs', 'packages/fflas/scripts/native-prefix.cjs', 'packages/fflas/package.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: linux-arm64-fflas-

      - name: Restore the canonical authenticated numerical runtime
        uses: actions/download-artifact@v8
        with:
          name: sagejs-numerical-product
          path: build/authenticated-numerical-product

      - name: Bootstrap the complete native system
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm bootstrap

      - name: Execute the resident exact native witness
        run: node --test test/native-rank-four-lattice-workspace.cjs

      - name: Enforce the development startup budget
        run: pnpm test:startup:run

      - name: Run strict baselib checks
        run: pnpm test:baselib:strict

      # The exhaustive host-integration tier runs on Linux x64 and macOS.
      # Repeating its 312 files after a full ARM native bootstrap cannot fit
      # this job's release budget; keep ARM focused on cross-platform source
      # behavior and the complete architecture-specific native suite.
      - name: Run portable and native tests
        run: |
          pnpm test:portable
          pnpm test:native:run

      - name: Build and relocation-test both SEA executables
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm test:sea:reuse

      - name: Package the Linux arm64 SEA distribution
        run: |
          mkdir -p build/release/sagejs-linux-arm64/licenses
          cp build/sea/sagejs build/sea/sagepython build/release/sagejs-linux-arm64/
          cp LICENSE README.md DISTRIBUTION.md build/release/sagejs-linux-arm64/
          cp licenses/* build/release/sagejs-linux-arm64/licenses/
          tar -C build/release -cJf build/release/sagejs-linux-arm64.tar.xz sagejs-linux-arm64
          cd build/release
          sha256sum sagejs-linux-arm64.tar.xz > sagejs-linux-arm64.tar.xz.sha256

      - name: Package Linux arm64 for npm
        run: |
          pnpm package:native-npm linux-arm64 build/sea/sagejs build/sea/sagepython
          SAGEJS_SKIP_PREPACK=1 pnpm pack --out build/release/npm/sagejs.tgz

      - name: Cache authenticated numerical oracle inputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache@v6
        with:
          path: build/numerical-scipy-downloads
          key: numerical-scipy-linux-arm64-${{ hashFiles('bench/numerical-computing/qualification/scipy-oracle-catalog.json') }}

      - name: Provision the hermetic numerical oracle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build/numerical-scipy-downloads build/numerical-scipy
          pnpm release:qualify:numerics:oracle -- \
            --artifact-directory build/numerical-scipy-downloads \
            --prefix build/numerical-scipy/prefix \
            --provenance build/numerical-scipy/provenance.json \
            --download
          echo "SAGEJS_QUALIFICATION_SCIPY_PREFIX=$(pwd)/build/numerical-scipy/prefix" >> "$GITHUB_ENV"
          echo "SAGEJS_QUALIFICATION_SCIPY_PROVENANCE=$(pwd)/build/numerical-scipy/provenance.json" >> "$GITHUB_ENV"

      - name: Collect exact Linux arm64 numerical product rows
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm release:qualify:numerics:platform -- \
            --candidate "$(git rev-parse HEAD)" \
            --root-archive build/release/npm/sagejs.tgz \
            --platform-archive build/release/npm/sagejs-linux-arm64.tgz \
            --sea-executable build/sea/sagejs \
            --output build/numerical-qualification/platform/linux-arm64

      - name: Upload Linux arm64 numerical qualification
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: numerical-qualification-linux-arm64
          overwrite: true
          path: build/numerical-qualification/platform/linux-arm64
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux arm64 SEA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-linux-arm64
          overwrite: true
          path: |
            build/release/sagejs-linux-arm64.tar.xz
            build/release/sagejs-linux-arm64.tar.xz.sha256
            build/release/npm/sagejs-linux-arm64.tgz
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    name: Windows x64 native, tests, and SEA
    needs: [routine, numerical-product]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.platform_smoke && (inputs.native_targets == 'all' || contains(inputs.native_targets, 'windows-x64'))) || github.event_name == 'schedule' }}
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 240
    env:
      SAGEJS_NATIVE_PREBUILT_REQUIRED: "1"
      SAGEJS_NUMERICAL_PRODUCT_ROOT: ${{ github.workspace }}/build/authenticated-numerical-product
      SAGEJS_NUMERICAL_RUNTIME_REQUIRED: "1"
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Ensure Visual Studio clang-cl is installed
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installer "vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          if (-not $installation) {
            throw "Visual Studio Build Tools are required on the Windows runner"
          }

          $clangInstallation = & $vswhere -latest -products * `
            -requires `
              Microsoft.VisualStudio.Component.VC.Llvm.Clang `
              Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset `
            -property installationPath
          if (-not $clangInstallation) {
            $setup = Join-Path $installer "setup.exe"
            $arguments = 'modify --installPath "{0}" --add {1} --add {2} --quiet --norestart' -f `
              $installation,
              "Microsoft.VisualStudio.Component.VC.Llvm.Clang",
              "Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset"
            $process = Start-Process -FilePath $setup `
              -ArgumentList $arguments `
              -Wait `
              -PassThru
            if ($process.ExitCode -notin 0, 3010) {
              throw "Visual Studio clang-cl installation failed with exit code $($process.ExitCode)"
            }
          }

          $clangInstallation = & $vswhere -latest -products * `
            -requires `
              Microsoft.VisualStudio.Component.VC.Llvm.Clang `
              Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset `
            -property installationPath
          if (-not $clangInstallation) {
            throw "Visual Studio clang-cl installation did not register its MSBuild toolset"
          }

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Cache vcpkg arithmetic dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/flint/.native/vcpkg
            packages/flint/.native/vcpkg-installed
          key: windows-x64-flint-${{ hashFiles('packages/flint/vcpkg.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/scripts/triplets/*.cmake', 'packages/flint/scripts/vcpkg-ports/**/*', 'packages/flint/binding.gyp') }}
          restore-keys: |
            windows-x64-flint-
            windows-x64-native-

      - name: Cache downloaded and compiled graph dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/graph/.native/downloads
            packages/graph/.native/prefix
          key: windows-x64-graph-${{ hashFiles('packages/graph/scripts/build-deps.cjs', 'packages/graph/package.json') }}
          restore-keys: windows-x64-graph-

      - name: Restore the canonical authenticated numerical runtime
        uses: actions/download-artifact@v8
        with:
          name: sagejs-numerical-product
          path: build/authenticated-numerical-product

      - name: Bootstrap the compiler and native mathematics stack
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm bootstrap --without-sea

      - name: Execute the resident exact native witness
        run: node --test test/native-rank-four-lattice-workspace.cjs

      - name: Enforce the development startup budget
        run: pnpm test:startup:run

      - name: Run portable tests
        run: pnpm test:portable

      - name: Run host integration tests
        timeout-minutes: 75
        run: pnpm test:integration:run

      - name: Run native addon tests
        run: pnpm test:native:run

      - name: Build and relocation-test both Windows SEA executables
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm test:sea:reuse

      - name: Authenticate to Azure Artifact Signing
        if: startsWith(github.ref, 'refs/tags/v') && vars.SAGEJS_WINDOWS_SIGNING_MODE == 'azure'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.SAGEJS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SAGEJS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SAGEJS_AZURE_SUBSCRIPTION_ID }}

      - name: Sign with Azure Artifact Signing
        if: startsWith(github.ref, 'refs/tags/v') && vars.SAGEJS_WINDOWS_SIGNING_MODE == 'azure'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SAGEJS_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SAGEJS_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SAGEJS_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\sea
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Azure-signed Windows executables
        if: startsWith(github.ref, 'refs/tags/v') && vars.SAGEJS_WINDOWS_SIGNING_MODE == 'azure'
        run: pwsh -File scripts/sign-windows.ps1 -VerifyOnly

      - name: Authenticode-sign tagged Windows executables with a PFX
        if: startsWith(github.ref, 'refs/tags/v') && vars.SAGEJS_WINDOWS_SIGNING_MODE == 'pfx'
        env:
          SAGEJS_WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.SAGEJS_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          SAGEJS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.SAGEJS_WINDOWS_CERTIFICATE_PASSWORD }}
        run: pnpm release:windows:sign

      - name: Record the Windows signing policy
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_MODE: ${{ vars.SAGEJS_WINDOWS_SIGNING_MODE }}
        run: |
          $mode = $env:SIGNING_MODE
          if ([string]::IsNullOrWhiteSpace($mode)) {
            $mode = "unsigned"
          }
          if ($mode -notin @("azure", "pfx", "unsigned")) {
            throw "Unsupported SAGEJS_WINDOWS_SIGNING_MODE: $mode"
          }
          if ($mode -eq "unsigned") {
            Write-Warning "Publishing unsigned Windows executables for this early-alpha release."
          }
          "## Windows signing`n`nMode: **$mode**" >> $env:GITHUB_STEP_SUMMARY

      - name: Package the Windows x64 SEA distribution
        shell: pwsh
        run: |
          $release = "build/release/sagejs-windows-x64"
          New-Item -ItemType Directory -Force "$release/licenses" | Out-Null
          Copy-Item build/sea/sagejs.exe,build/sea/sagepython.exe $release
          Copy-Item LICENSE,README.md,DISTRIBUTION.md $release
          Copy-Item licenses/* "$release/licenses"
          Compress-Archive -Path "$release/*" -DestinationPath "build/release/sagejs-windows-x64.zip"
          (Get-FileHash "build/release/sagejs-windows-x64.zip" -Algorithm SHA256).Hash.ToLower() +
            "  sagejs-windows-x64.zip" |
            Set-Content "build/release/sagejs-windows-x64.zip.sha256"

      - name: Package Windows x64 for npm
        run: pnpm package:native-npm windows-x64 build/sea/sagejs.exe build/sea/sagepython.exe

      - name: Pack the public npm package on Windows
        env:
          SAGEJS_SKIP_PREPACK: "1"
        run: pnpm pack --out build/release/npm/sagejs.tgz

      - name: Cache authenticated numerical oracle inputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache@v6
        with:
          path: build/numerical-scipy-downloads
          key: numerical-scipy-windows-x64-${{ hashFiles('bench/numerical-computing/qualification/scipy-oracle-catalog.json') }}

      - name: Provision the hermetic numerical oracle
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/numerical-scipy-downloads,build/numerical-scipy | Out-Null
          pnpm release:qualify:numerics:oracle -- `
            --artifact-directory build/numerical-scipy-downloads `
            --prefix build/numerical-scipy/prefix `
            --provenance build/numerical-scipy/provenance.json `
            --download
          $root = (Resolve-Path .).Path
          "SAGEJS_QUALIFICATION_SCIPY_PREFIX=$root\build\numerical-scipy\prefix" >> $env:GITHUB_ENV
          "SAGEJS_QUALIFICATION_SCIPY_PROVENANCE=$root\build\numerical-scipy\provenance.json" >> $env:GITHUB_ENV

      - name: Collect exact Windows x64 numerical product rows
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $candidate = git rev-parse HEAD
          pnpm release:qualify:numerics:platform -- `
            --candidate $candidate `
            --root-archive build/release/npm/sagejs.tgz `
            --platform-archive build/release/npm/sagejs-windows-x64.tgz `
            --sea-executable build/sea/sagejs.exe `
            --output build/numerical-qualification/platform/windows-x64

      - name: Upload Windows x64 numerical qualification
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: numerical-qualification-windows-x64
          overwrite: true
          path: build/numerical-qualification/platform/windows-x64
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows x64 SEA artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-windows-x64
          overwrite: true
          path: |
            build/release/sagejs-windows-x64.zip
            build/release/sagejs-windows-x64.zip.sha256
            build/release/npm/sagejs-windows-x64.tgz
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS arm64 native, tests, and SEA
    needs: [routine, numerical-product]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.platform_smoke && (inputs.native_targets == 'all' || contains(inputs.native_targets, 'macos-arm64'))) || github.event_name == 'schedule' }}
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 180
    env:
      SAGEJS_NATIVE_PREBUILT_REQUIRED: "1"
      SAGEJS_NUMERICAL_PRODUCT_ROOT: ${{ github.workspace }}/build/authenticated-numerical-product
      SAGEJS_NUMERICAL_RUNTIME_REQUIRED: "1"

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install the supported CPython reference
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install native build prerequisites
        run: |
          brew untap aws/tap || true
          brew install cmake m4 xz

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Cache downloaded and compiled arithmetic dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: macos-arm64-flint-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: |
            macos-arm64-flint-
            macos-arm64-native-

      - name: Cache downloaded and compiled graph dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/graph/.native/downloads
            packages/graph/.native/prefix
          key: macos-arm64-graph-${{ hashFiles('packages/graph/scripts/build-deps.cjs', 'packages/graph/package.json') }}
          restore-keys: macos-arm64-graph-

      - name: Cache downloaded and compiled FFLAS dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/fflas/.native/downloads
            packages/fflas/.native/prefix
          key: macos-arm64-fflas-${{ hashFiles('packages/fflas/scripts/build-deps.cjs', 'packages/fflas/scripts/native-prefix.cjs', 'packages/fflas/package.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: macos-arm64-fflas-

      - name: Cache downloaded and compiled M4RI dependencies
        uses: actions/cache@v6
        with:
          path: |
            packages/m4ri/.native/downloads
            packages/m4ri/.native/prefix
          key: macos-arm64-m4ri-${{ hashFiles('packages/m4ri/scripts/build-deps.cjs', 'packages/m4ri/scripts/native-prefix.cjs', 'packages/m4ri/package.json') }}
          restore-keys: macos-arm64-m4ri-

      - name: Restore the canonical authenticated numerical runtime
        uses: actions/download-artifact@v8
        with:
          name: sagejs-numerical-product
          path: build/authenticated-numerical-product

      - name: Bootstrap the compiler and native mathematics stack
        env:
          SAGEJS_BUILD_JOBS: "6"
        run: pnpm bootstrap --without-sea

      - name: Execute the resident exact native witness
        run: node --test test/native-rank-four-lattice-workspace.cjs

      - name: Enforce the development startup budget
        run: pnpm test:startup:run

      - name: Run portable, host integration, and native tests
        env:
          PYTHON: python3
        run: |
          pnpm test:portable
          pnpm test:integration:run
          pnpm test:native:run

      - name: Build and relocation-test both macOS SEA executables
        env:
          SAGEJS_BUILD_JOBS: "6"
        run: pnpm test:sea:reuse

      - name: Pack public npm source for signed qualification
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SAGEJS_SKIP_PREPACK: "1"
        run: pnpm pack --out build/release/npm/sagejs.tgz

      - name: Cache authenticated numerical oracle inputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/cache@v6
        with:
          path: build/numerical-scipy-downloads
          key: numerical-scipy-macos-arm64-${{ hashFiles('bench/numerical-computing/qualification/scipy-oracle-catalog.json') }}

      - name: Provision the hermetic numerical oracle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p build/numerical-scipy-downloads build/numerical-scipy
          pnpm release:qualify:numerics:oracle -- \
            --artifact-directory build/numerical-scipy-downloads \
            --prefix build/numerical-scipy/prefix \
            --provenance build/numerical-scipy/provenance.json \
            --download
          echo "SAGEJS_QUALIFICATION_SCIPY_PREFIX=$(pwd)/build/numerical-scipy/prefix" >> "$GITHUB_ENV"
          echo "SAGEJS_QUALIFICATION_SCIPY_PROVENANCE=$(pwd)/build/numerical-scipy/provenance.json" >> "$GITHUB_ENV"

      - name: Collect the exact macOS Node numerical row
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pnpm release:qualify:numerics:platform -- \
            --candidate "$(git rev-parse HEAD)" \
            --subjects node \
            --output build/numerical-qualification/platform/macos-arm64

      - name: Upload macOS numerical signing inputs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-macos-arm64-qualification-input
          overwrite: true
          path: |
            build/numerical-qualification/platform/macos-arm64
            build/release/npm/sagejs.tgz
            dist/numerical
          if-no-files-found: error
          retention-days: 14

      - name: Upload validated macOS executables for signing
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-macos-arm64-unsigned
          overwrite: true
          path: |
            build/sea/sagejs
            build/sea/sagepython
          if-no-files-found: error
          retention-days: 14

  macos-sign:
    name: Sign and notarize macOS arm64 release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos-arm64
    # Blacksmith's macOS fleet is available in 6- and 12-vCPU sizes only.
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 120
    environment: sagejs-signing

    steps:
      - name: Check out the tagged release metadata
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1

      - name: Install the exact source dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the validated macOS executables
        uses: actions/download-artifact@v8
        with:
          name: sagejs-macos-arm64-unsigned
          path: build/sea

      - name: Download the source-bound numerical qualification inputs
        uses: actions/download-artifact@v8
        with:
          name: sagejs-macos-arm64-qualification-input
          path: .

      - name: Cache authenticated numerical oracle inputs
        uses: actions/cache@v6
        with:
          path: build/numerical-scipy-downloads
          key: numerical-scipy-macos-arm64-${{ hashFiles('bench/numerical-computing/qualification/scipy-oracle-catalog.json') }}

      - name: Provision the identical hermetic numerical oracle
        run: |
          mkdir -p build/numerical-scipy-downloads build/numerical-scipy
          pnpm release:qualify:numerics:oracle -- \
            --artifact-directory build/numerical-scipy-downloads \
            --prefix build/numerical-scipy/prefix \
            --provenance build/numerical-scipy/provenance.json \
            --download
          echo "SAGEJS_QUALIFICATION_SCIPY_PREFIX=$(pwd)/build/numerical-scipy/prefix" >> "$GITHUB_ENV"
          echo "SAGEJS_QUALIFICATION_SCIPY_PROVENANCE=$(pwd)/build/numerical-scipy/provenance.json" >> "$GITHUB_ENV"

      - name: Restore executable permissions
        run: chmod 755 build/sea/sagejs build/sea/sagepython

      - name: Import Apple release credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.SAGEJS_APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SAGEJS_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.SAGEJS_APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.SAGEJS_APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.SAGEJS_APPLE_NOTARY_ISSUER_ID }}
        run: |
          for value in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            [[ -n "${!value}" ]] || { echo "Missing $value" >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/sagejs-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/sagejs-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_CERTIFICATE_P12, "base64"))' \
            "$certificate"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_NOTARY_KEY, "base64"))' \
            "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          {
            echo "SAGEJS_MACOS_NOTARY_KEY=$api_key"
            echo "SAGEJS_MACOS_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID"
            echo "SAGEJS_MACOS_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Sign, notarize, and package macOS arm64
        env:
          SAGEJS_MACOS_SIGN_ID: ${{ secrets.SAGEJS_MACOS_SIGN_ID }}
          SAGEJS_MACOS_INSTALLER_ID: ${{ secrets.SAGEJS_MACOS_INSTALLER_ID }}
        run: pnpm release:macos --skip-build

      - name: Package macOS arm64 for npm
        run: |
          pnpm package:native-npm macos-arm64 \
            build/release/sagejs-macos-arm64/sagejs \
            build/release/sagejs-macos-arm64/sagepython

      - name: Collect exact signed macOS npm and SEA numerical rows
        run: |
          pnpm release:qualify:numerics:platform -- \
            --candidate "$(git rev-parse HEAD)" \
            --subjects npm,sea \
            --root-archive build/release/npm/sagejs.tgz \
            --platform-archive build/release/npm/sagejs-macos-arm64.tgz \
            --sea-executable build/release/sagejs-macos-arm64/sagejs \
            --output build/numerical-qualification/platform/macos-arm64

      - name: Upload signed macOS numerical qualification
        uses: actions/upload-artifact@v7
        with:
          name: numerical-qualification-macos-arm64
          overwrite: true
          path: build/numerical-qualification/platform/macos-arm64
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed macOS arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sagejs-macos-arm64
          overwrite: true
          path: |
            build/release/sagejs-macos-arm64.zip
            build/release/sagejs-macos-arm64.zip.sha256
            build/release/sagejs-macos-arm64.pkg
            build/release/sagejs-macos-arm64.pkg.sha256
            build/release/npm/sagejs-macos-arm64.tgz
          if-no-files-found: error
          retention-days: 14

  numerical-browser-qualification:
    name: Numerical browser and supplemental qualification
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x64, numerical-product]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: sagejs-source-mirror
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SAGEJS_WASM_SOURCE_MIRROR_DIR: /tmp/sagejs-numerical-source-mirror
      SAGEJS_NUMERICAL_PRODUCT_ROOT: ${{ github.workspace }}/build/authenticated-numerical-product
      SAGEJS_NUMERICAL_RUNTIME_REQUIRED: "1"

    steps:
      - name: Check out the exact tagged candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Fetch every pinned Wasm source from the private mirror
        run: |
          node tools/source-mirror/scripts/source-mirror.mjs fetch \
            --output "$SAGEJS_WASM_SOURCE_MIRROR_DIR"
          node tools/source-mirror/scripts/source-mirror.mjs environment \
            --input "$SAGEJS_WASM_SOURCE_MIRROR_DIR" >> "$GITHUB_ENV"

      - name: Install the exact JavaScript dependency graph
        run: pnpm install --frozen-lockfile

      - name: Restore the canonical authenticated numerical runtime
        uses: actions/download-artifact@v8
        with:
          name: sagejs-numerical-product
          path: build/authenticated-numerical-product

      - name: Cache authenticated numerical oracle inputs
        uses: actions/cache@v6
        with:
          path: build/numerical-scipy-downloads
          key: numerical-scipy-linux-x64-${{ hashFiles('bench/numerical-computing/qualification/scipy-oracle-catalog.json') }}

      - name: Provision the hermetic numerical oracle
        run: |
          mkdir -p build/numerical-scipy-downloads build/numerical-scipy
          pnpm release:qualify:numerics:oracle -- \
            --artifact-directory build/numerical-scipy-downloads \
            --prefix build/numerical-scipy/prefix \
            --provenance build/numerical-scipy/provenance.json \
            --download
          echo "SAGEJS_QUALIFICATION_SCIPY_PREFIX=$(pwd)/build/numerical-scipy/prefix" >> "$GITHUB_ENV"
          echo "SAGEJS_QUALIFICATION_SCIPY_PROVENANCE=$(pwd)/build/numerical-scipy/provenance.json" >> "$GITHUB_ENV"

      - name: Restore the exact Linux SEA selected for publication
        uses: actions/download-artifact@v8
        with:
          name: sagejs-linux-x64
          path: build/linux-release

      - name: Build the source-authenticated browser product
        run: |
          node packages/wasm-toolchain/scripts/toolchain.cjs prepare
          pnpm build
          # The authenticated handoff is the product under test, but the
          # sanitizer collector also needs source-current build reports and
          # expanded upstream sources.  Build that evidence once without the
          # handoff environment, then reinstall the canonical product below.
          env -u SAGEJS_NUMERICAL_PRODUCT_ROOT \
            -u SAGEJS_NUMERICAL_RUNTIME_REQUIRED \
            node packages/flint-wasm/numerical/scripts/build-all.cjs
          pnpm --dir packages/flint-wasm build
          node scripts/numerical-product.cjs install \
            --input "$SAGEJS_NUMERICAL_PRODUCT_ROOT"
          node scripts/numerical-product.cjs validate-installed
          node packages/flint-wasm/scripts/production-receipt.cjs validate
          mkdir -p build/sea
          tar -xJf build/linux-release/sagejs-linux-x64.tar.xz -C build/linux-release
          cp build/linux-release/sagejs-linux-x64/sagejs build/sea/sagejs
          chmod 755 build/sea/sagejs

      - name: Install all required real browser engines
        run: pnpm exec playwright-core install --with-deps chromium firefox webkit

      - name: Collect four browser rows and five supplemental categories
        run: |
          pnpm release:qualify:numerics:browser -- \
            --candidate "$(git rev-parse HEAD)" \
            --artifact packages/flint-wasm \
            --output build/numerical-qualification/browser

      - name: Upload browser and supplemental numerical qualification
        uses: actions/upload-artifact@v7
        with:
          name: numerical-qualification-browser-supplemental
          overwrite: true
          path: |
            build/numerical-qualification/browser
            build/sea/sagejs
            dist/numerical
            packages/flint-wasm/dist
            packages/flint-wasm/numerical/build
          if-no-files-found: error
          retention-days: 14

  numerical-release-gate:
    name: Numerical release qualification gate
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-x64
      - linux-arm64
      - windows-x64
      - macos-sign
      - numerical-browser-qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the exact tagged candidate
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore each platform producer without cross-artifact merging
        uses: actions/download-artifact@v8
        with:
          name: numerical-qualification-linux-x64
          path: build/numerical-qualification/platform/linux-x64
      - uses: actions/download-artifact@v8
        with:
          name: numerical-qualification-linux-arm64
          path: build/numerical-qualification/platform/linux-arm64
      - uses: actions/download-artifact@v8
        with:
          name: numerical-qualification-windows-x64
          path: build/numerical-qualification/platform/windows-x64
      - uses: actions/download-artifact@v8
        with:
          name: numerical-qualification-macos-arm64
          path: build/numerical-qualification/platform/macos-arm64
      - uses: actions/download-artifact@v8
        with:
          name: numerical-qualification-browser-supplemental
          path: .

      - name: Rebuild and require the exact 16-row release gate
        run: |
          pnpm release:qualify:numerics:gate -- \
            --candidate "$(git rev-parse HEAD)" \
            --input build/numerical-qualification \
            --output build/numerical-qualification/gate
          mkdir -p build/validated-numerical-gate
          cp build/numerical-qualification/gate/release-gate.json \
            build/validated-numerical-gate/release-gate.json
          rm -rf build/numerical-qualification/gate
          pnpm release:qualify:numerics:gate -- \
            --candidate "$(git rev-parse HEAD)" \
            --input build/numerical-qualification \
            --output build/numerical-qualification/gate
          pnpm release:qualify:numerics:authenticate -- \
            --candidate "$(git rev-parse HEAD)" \
            --gate build/validated-numerical-gate/release-gate.json \
            --rebuilt-gate build/numerical-qualification/gate/release-gate.json

      - name: Preserve the final numerical release evidence
        uses: actions/upload-artifact@v7
        with:
          name: numerical-release-gate
          overwrite: true
          path: build/numerical-qualification/gate
          if-no-files-found: error
          retention-days: 90

      - name: Preserve the reproducible raw numerical evidence inventory
        uses: actions/upload-artifact@v7
        with:
          name: numerical-release-evidence
          overwrite: true
          path: |
            build/numerical-qualification/platform
            build/numerical-qualification/browser/rows
            build/numerical-qualification/browser/supplemental
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish tagged GitHub and npm release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - numerical-release-gate
    runs-on: ubuntu-24.04
    environment: sagejs-release
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Check out the tagged release metadata
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          registry-url: https://registry.npmjs.org

      - name: Restore the mandatory numerical release gate
        uses: actions/download-artifact@v8
        with:
          name: numerical-release-gate
          path: build/validated-numerical-gate

      - name: Restore the complete raw numerical evidence inventory
        uses: actions/download-artifact@v8
        with:
          name: numerical-release-evidence
          path: build/numerical-qualification

      - name: Download the validated release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p release
          for artifact in \
            sagejs-linux-x64 \
            sagejs-linux-arm64 \
            sagejs-windows-x64 \
            sagejs-macos-arm64
          do
            gh run download "$GITHUB_RUN_ID" --repo "$GH_REPO" \
              --name "$artifact" --dir release
          done

      - name: Rebuild and authenticate the gate and exact public npm root
        run: |
          pnpm release:qualify:numerics:gate -- \
            --candidate "$(git rev-parse HEAD)" \
            --input build/numerical-qualification \
            --output build/numerical-qualification/gate
          pnpm release:qualify:numerics:authenticate -- \
            --candidate "$(git rev-parse HEAD)" \
            --gate build/validated-numerical-gate/release-gate.json \
            --rebuilt-gate build/numerical-qualification/gate/release-gate.json \
            --public-npm-root release/npm/sagejs.tgz

      - name: Create or update the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]] || {
              echo "Release $TAG already exists and is not a mutable draft" >&2
              exit 1
            }
          else
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "Sage.js ${TAG#v} — early alpha" \
              --notes-file RELEASE_NOTES.md
          fi
          mapfile -t assets < <(find release -maxdepth 1 -type f -print | sort)
          [[ ${#assets[@]} -gt 0 ]] || { echo "No release assets" >&2; exit 1; }
          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Publish the platform and public npm packages
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          package_version="$(tar -xOzf release/npm/sagejs.tgz package/package.json | \
            node -e "let text=''; process.stdin.on('data',x=>text+=x); process.stdin.on('end',()=>console.log(JSON.parse(text).version))")"
          case "${GITHUB_REF_NAME}" in
            "v${package_version}") ;;
            "v${package_version}+release."*)
              recovery="${GITHUB_REF_NAME#v${package_version}+release.}"
              [[ "$recovery" =~ ^[1-9][0-9]*$ ]] || {
                echo "Invalid recovery tag ${GITHUB_REF_NAME}" >&2
                exit 1
              }
              ;;
            *)
              echo "Tag ${GITHUB_REF_NAME} does not match npm version ${package_version}" >&2
              exit 1
              ;;
          esac

          publish_package() {
            local archive="$1"
            local tag="$2"
            local metadata name version published published_integrity local_integrity tags tagged_version
            metadata="$(tar -xOzf "$archive" package/package.json)"
            name="$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "$metadata")"
            version="$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$metadata")"
            [[ "$version" == "$package_version" ]] || {
              echo "$archive contains ${name}@${version}, expected version ${package_version}" >&2
              exit 1
            }
            local_integrity="$(node -e \
              'const fs=require("node:fs"),crypto=require("node:crypto"); const bytes=fs.readFileSync(process.argv[1]); console.log(`sha512-${crypto.createHash("sha512").update(bytes).digest("base64")}`)' \
              "$archive")"
            if published="$(npm view "${name}@${version}" version --json 2>/dev/null)"; then
              [[ "$(node -e 'console.log(JSON.parse(process.argv[1]))' "$published")" == "$version" ]] || {
                echo "Unexpected published version for ${name}@${version}: $published" >&2
                exit 1
              }
              published_integrity="$(npm view "${name}@${version}" dist.integrity --json)"
              published_integrity="$(node -e \
                'const value=JSON.parse(process.argv[1]); if(typeof value !== "string") process.exit(1); console.log(value)' \
                "$published_integrity")"
              [[ "$published_integrity" == "$local_integrity" ]] || {
                echo "${name}@${version} exists with different registry integrity" >&2
                exit 1
              }
              tags="$(npm view "$name" dist-tags --json)"
              tagged_version="$(node -e \
                'console.log(JSON.parse(process.argv[1])[process.argv[2]] ?? "")' \
                "$tags" "$tag")"
              [[ "$tagged_version" == "$version" ]] || {
                echo "${name}@${version} exists but dist-tag ${tag} points at ${tagged_version:-nothing}" >&2
                exit 1
              }
              echo "${name}@${version} is already published with dist-tag ${tag}; skipping"
            else
              npm publish "$archive" \
                --access public --tag "$tag" --ignore-scripts
            fi
          }

          publish_package release/npm/sagejs-linux-x64.tgz linux-x64
          publish_package release/npm/sagejs-linux-arm64.tgz linux-arm64
          publish_package release/npm/sagejs-windows-x64.tgz windows-x64
          publish_package release/npm/sagejs-macos-arm64.tgz macos-arm64
          publish_package release/npm/sagejs.tgz latest

          wait_for_package() {
            local archive="$1"
            local metadata name version encoded
            metadata="$(tar -xOzf "$archive" package/package.json)"
            name="$(node -e 'console.log(JSON.parse(process.argv[1]).name)' "$metadata")"
            version="$(node -e 'console.log(JSON.parse(process.argv[1]).version)' "$metadata")"
            encoded="$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$name")"
            for attempt in {1..120}; do
              if curl --fail --silent --output /dev/null \
                "https://registry.npmjs.org/${encoded}/${version}"
              then
                echo "Public npm registry serves ${name}@${version}"
                return
              fi
              if (( attempt % 4 == 0 )); then
                echo "Waiting for npm scanning: ${name}@${version} (${attempt}/120)"
              fi
              sleep 15
            done
            echo "npm did not make ${name}@${version} public within 30 minutes" >&2
            exit 1
          }

          wait_for_package release/npm/sagejs-linux-x64.tgz
          wait_for_package release/npm/sagejs-linux-arm64.tgz
          wait_for_package release/npm/sagejs-windows-x64.tgz
          wait_for_package release/npm/sagejs-macos-arm64.tgz
          wait_for_package release/npm/sagejs.tgz

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

  recover-publish:
    name: Re-run a validated release publication
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_run_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read

    steps:
      - name: Check out the immutable recovery tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.recovery_tag }}

      - name: Authenticate the source run and rerun its original trusted publisher
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          RECOVERY_TAG: ${{ inputs.recovery_tag }}
        run: |
          set -euo pipefail
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "recovery_run_id must be a positive Actions run ID" >&2
            exit 1
          }
          [[ "$RECOVERY_TAG" == v* ]] || {
            echo "recovery_tag must be a release tag" >&2
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == "$RECOVERY_TAG" ]] || {
            echo "Dispatch this recovery at ref $RECOVERY_TAG, not $GITHUB_REF_NAME" >&2
            exit 1
          }
          run_metadata="$(gh api "repos/${GH_REPO}/actions/runs/${RECOVERY_RUN_ID}")"
          [[ "$(jq -r .name <<<"$run_metadata")" == "Sage.js CI" ]]
          [[ "$(jq -r .path <<<"$run_metadata")" == ".github/workflows/ci.yml" ]]
          [[ "$(jq -r .event <<<"$run_metadata")" == "push" ]]
          [[ "$(jq -r .status <<<"$run_metadata")" == "completed" ]]
          [[ "$(jq -r '.head_branch // ""' <<<"$run_metadata")" == "$RECOVERY_TAG" ]] || {
            echo "Source run was not triggered by exact tag $RECOVERY_TAG" >&2
            exit 1
          }
          source_sha="$(jq -r .head_sha <<<"$run_metadata")"
          tag_sha="$(git rev-list -n 1 "$RECOVERY_TAG")"
          [[ "$source_sha" == "$tag_sha" && "$tag_sha" == "$(git rev-parse HEAD)" ]] || {
            echo "Recovery source/tag/checkout SHA mismatch" >&2
            exit 1
          }
          jobs_file="$(mktemp)"
          gh api --paginate \
            "repos/${GH_REPO}/actions/runs/${RECOVERY_RUN_ID}/jobs?filter=all&per_page=100" \
            | jq -s '.' > "$jobs_file"
          publisher_id="$(node scripts/release/select-recovery-publisher.cjs < "$jobs_file")"
          gh api --method POST "repos/${GH_REPO}/actions/jobs/${publisher_id}/rerun"
