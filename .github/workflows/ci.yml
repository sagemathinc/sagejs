name: Sage.js CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sagejs-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}

jobs:
  release-tag-policy:
    name: Classify and validate the release tag
    runs-on: ubuntu-24.04
    outputs:
      candidate: ${{ steps.policy.outputs.candidate }}
      publish: ${{ steps.policy.outputs.publish }}
    steps:
      - name: Check out the source that declares the release version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Node.js for version policy
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0

      - name: Require release tags to come from the main branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: node scripts/release-source-policy.cjs

      - name: Accept only stable or release-candidate version tags
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          node scripts/release-tag-policy.cjs >> "$GITHUB_OUTPUT"

  linux-x64:
    name: Linux x64 native, tests, and SEA
    needs: release-tag-policy
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    outputs:
      release-artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      release-artifact-digest: ${{ steps.upload-release.outputs.artifact-digest }}

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake python3 python3-jupyter-client m4 xz-utils

      - name: Cache downloaded and compiled arithmetic dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: linux-x64-flint-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: |
            linux-x64-flint-
            linux-x64-native-

      - name: Cache downloaded and compiled graph dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/graph/.native/downloads
            packages/graph/.native/prefix
          key: linux-x64-graph-${{ hashFiles('packages/graph/scripts/build-deps.cjs', 'packages/graph/package.json') }}
          restore-keys: linux-x64-graph-

      - name: Cache downloaded and compiled FFLAS dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/fflas/.native/downloads
            packages/fflas/.native/prefix
          key: linux-x64-fflas-${{ hashFiles('packages/fflas/scripts/build-deps.cjs', 'packages/fflas/scripts/native-prefix.cjs', 'packages/fflas/package.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: linux-x64-fflas-

      - name: Bootstrap the complete native system
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm bootstrap

      - name: Enforce the development startup budget
        run: pnpm test:startup:run

      - name: Validate parallel project contracts
        run: pnpm parallel:check -- --all

      - name: Run strict baselib checks
        run: pnpm test:baselib:strict

      - name: Run compiler compatibility diagnostics
        id: compiler
        run: |
          set +e
          pnpm test:compiler
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            result="passed"
          else
            result="known failures (exit $status)"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Run unit, host integration, and native tests
        run: |
          pnpm test:unit
          pnpm test:integration
          pnpm test:native
          pnpm test:installer
          pnpm test:release

      - name: Verify generated reference and imported Sage examples
        run: |
          pnpm docs:verify
          git diff --exit-code -- \
            docs/reference/api.md \
            website/reference.html \
            website/reference-data.json \
            website/reference-results.json
          pnpm test:upstream:run

      - name: Run Sage tutorial compatibility diagnostics
        id: tutorial
        run: |
          set +e
          pnpm test:tutorial
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            result="passed"
          else
            result="known failures (exit $status)"
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Build and relocation-test both SEA executables
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm test:sea

      - name: Exercise the SEA Jupyter wire protocol
        run: pnpm test:jupyter:sea

      - name: Record non-blocking compatibility status
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Compatibility diagnostics

          | Suite | Outcome |
          | --- | --- |
          | Compiler corpus | **${{ steps.compiler.outputs.result }}** |
          | Sage tutorial | **${{ steps.tutorial.outputs.result }}** |

          These broad compatibility suites already contain failures on the
          baseline that introduced CI. They remain visible and non-blocking
          while those existing failures are triaged; bootstrap, strict baselib,
          unit, host integration, native, and SEA tests are blocking.
          EOF

      - name: Build the receipted glibc-floor Linux x64 release inputs
        if: needs.release-tag-policy.outputs.candidate == 'true'
        run: |
          node scripts/linux-baseline/release-inputs.cjs \
            --platform linux-x64 \
            --all-inputs \
            --source-ref "$GITHUB_SHA" \
            --output build/linux-baseline

      - name: Validate and package the receipted Linux x64 release candidate
        if: needs.release-tag-policy.outputs.candidate == 'true'
        run: |
          node scripts/release-candidate-linux.cjs \
            --baseline-receipt build/linux-baseline/linux-baseline-receipt.json \
            --math build/linux-baseline/sea/sagejs \
            --python build/linux-baseline/sea/sagepython \
            --math-receipt build/linux-baseline/sea/sagejs-build-manifest.json \
            --python-receipt build/linux-baseline/sea/sagepython-build-manifest.json \
            --release-directory build/release

      - name: Stage the shell installer
        if: needs.release-tag-policy.outputs.candidate == 'true'
        run: |
          cp install.sh build/release/install.sh

      - name: Accept the exact Linux x64 release candidate
        if: needs.release-tag-policy.outputs.candidate == 'true'
        run: |
          version="$(node -p 'require("./package.json").version')"
          commit="$(git rev-parse 'HEAD^{commit}')"
          [[ "$commit" == "$GITHUB_SHA" ]] || {
            echo "Linux x64 acceptance checkout differs from $GITHUB_SHA" >&2
            exit 1
          }
          node scripts/release-artifact-acceptance.cjs \
            --target linux-x64 \
            --archive build/release/sagejs-linux-x64.tar.xz \
            --checksum build/release/sagejs-linux-x64.tar.xz.sha256 \
            --output build/release/sagejs-linux-x64-acceptance.json \
            --expected-version "$version" \
            --expected-commit "$commit" \
            --signature unsigned \
            --maximum-glibc 2.28

      - name: Upload Linux x64 SEA artifacts
        if: needs.release-tag-policy.outputs.candidate == 'true'
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sagejs-linux-x64
          path: |
            build/release/sagejs-linux-x64.tar.xz
            build/release/sagejs-linux-x64.tar.xz.sha256
            build/release/sagejs-linux-x64.report.json
            build/release/sagejs-linux-x64.release.json
            build/release/install.sh
            build/release/sagejs-linux-x64-acceptance.json
            build/release/sagejs-linux-x64-acceptance.json.sha256
          if-no-files-found: error
          retention-days: 14

  linux-arm64:
    name: Linux arm64 native, tests, and SEA
    needs: release-tag-policy
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 150
    outputs:
      release-artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      release-artifact-digest: ${{ steps.upload-release.outputs.artifact-digest }}

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake python3 m4 xz-utils

      - name: Cache downloaded and compiled arithmetic dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: linux-arm64-flint-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: |
            linux-arm64-flint-
            linux-arm64-native-

      - name: Cache downloaded and compiled graph dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/graph/.native/downloads
            packages/graph/.native/prefix
          key: linux-arm64-graph-${{ hashFiles('packages/graph/scripts/build-deps.cjs', 'packages/graph/package.json') }}
          restore-keys: linux-arm64-graph-

      - name: Cache downloaded and compiled FFLAS dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/fflas/.native/downloads
            packages/fflas/.native/prefix
          key: linux-arm64-fflas-${{ hashFiles('packages/fflas/scripts/build-deps.cjs', 'packages/fflas/scripts/native-prefix.cjs', 'packages/fflas/package.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: linux-arm64-fflas-

      - name: Bootstrap the complete native system
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm bootstrap

      - name: Enforce the development startup budget
        run: pnpm test:startup:run

      - name: Run strict baselib checks
        run: pnpm test:baselib:strict

      - name: Run unit, host integration, and native tests
        run: |
          pnpm test:unit
          pnpm test:integration
          pnpm test:native

      - name: Build and relocation-test both SEA executables
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm test:sea

      - name: Build the receipted glibc-floor Linux arm64 release inputs
        if: needs.release-tag-policy.outputs.candidate == 'true'
        run: |
          node scripts/linux-baseline/release-inputs.cjs \
            --platform linux-arm64 \
            --all-inputs \
            --source-ref "$GITHUB_SHA" \
            --output build/linux-baseline-linux-arm64

      - name: Validate and package the receipted Linux arm64 release candidate
        if: needs.release-tag-policy.outputs.candidate == 'true'
        run: |
          node scripts/release-candidate-linux.cjs \
            --baseline-receipt build/linux-baseline-linux-arm64/linux-baseline-receipt.json \
            --math build/linux-baseline-linux-arm64/sea/sagejs \
            --python build/linux-baseline-linux-arm64/sea/sagepython \
            --math-receipt build/linux-baseline-linux-arm64/sea/sagejs-build-manifest.json \
            --python-receipt build/linux-baseline-linux-arm64/sea/sagepython-build-manifest.json \
            --release-directory build/release

      - name: Accept the exact Linux arm64 release candidate
        if: needs.release-tag-policy.outputs.candidate == 'true'
        run: |
          version="$(node -p 'require("./package.json").version')"
          commit="$(git rev-parse 'HEAD^{commit}')"
          [[ "$commit" == "$GITHUB_SHA" ]] || {
            echo "Linux arm64 acceptance checkout differs from $GITHUB_SHA" >&2
            exit 1
          }
          node scripts/release-artifact-acceptance.cjs \
            --target linux-arm64 \
            --archive build/release/sagejs-linux-arm64.tar.xz \
            --checksum build/release/sagejs-linux-arm64.tar.xz.sha256 \
            --output build/release/sagejs-linux-arm64-acceptance.json \
            --expected-version "$version" \
            --expected-commit "$commit" \
            --signature unsigned \
            --maximum-glibc 2.28

      - name: Upload Linux arm64 SEA artifacts
        if: needs.release-tag-policy.outputs.candidate == 'true'
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sagejs-linux-arm64
          path: |
            build/release/sagejs-linux-arm64.tar.xz
            build/release/sagejs-linux-arm64.tar.xz.sha256
            build/release/sagejs-linux-arm64.report.json
            build/release/sagejs-linux-arm64.release.json
            build/release/sagejs-linux-arm64-acceptance.json
            build/release/sagejs-linux-arm64-acceptance.json.sha256
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    name: Windows x64 native, tests, and SEA
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 120
    outputs:
      release-artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      release-artifact-digest: ${{ steps.upload-release.outputs.artifact-digest }}

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install Python for node-gyp
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Ensure Visual Studio clang-cl is installed
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer"
          $vswhere = Join-Path $installer "vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          if (-not $installation) {
            throw "Visual Studio Build Tools are required on the Windows runner"
          }

          $clangInstallation = & $vswhere -latest -products * `
            -requires `
              Microsoft.VisualStudio.Component.VC.Llvm.Clang `
              Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset `
            -property installationPath
          if (-not $clangInstallation) {
            $setup = Join-Path $installer "setup.exe"
            $arguments = 'modify --installPath "{0}" --add {1} --add {2} --quiet --norestart' -f `
              $installation,
              "Microsoft.VisualStudio.Component.VC.Llvm.Clang",
              "Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset"
            $process = Start-Process -FilePath $setup `
              -ArgumentList $arguments `
              -Wait `
              -PassThru
            if ($process.ExitCode -notin 0, 3010) {
              throw "Visual Studio clang-cl installation failed with exit code $($process.ExitCode)"
            }
          }

          $clangInstallation = & $vswhere -latest -products * `
            -requires `
              Microsoft.VisualStudio.Component.VC.Llvm.Clang `
              Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset `
            -property installationPath
          if (-not $clangInstallation) {
            throw "Visual Studio clang-cl installation did not register its MSBuild toolset"
          }

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Cache vcpkg arithmetic dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/flint/.native/vcpkg
            packages/flint/.native/vcpkg-installed
          key: windows-x64-flint-${{ hashFiles('packages/flint/vcpkg.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/scripts/triplets/*.cmake', 'packages/flint/scripts/vcpkg-ports/**/*', 'packages/flint/binding.gyp') }}
          restore-keys: |
            windows-x64-flint-
            windows-x64-native-

      - name: Cache downloaded and compiled graph dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/graph/.native/downloads
            packages/graph/.native/prefix
          key: windows-x64-graph-${{ hashFiles('packages/graph/scripts/build-deps.cjs', 'packages/graph/package.json') }}
          restore-keys: windows-x64-graph-

      - name: Build the compiler and native mathematics stack
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: |
          pnpm --dir packages/flint build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir packages/fflas build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir packages/graph build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build

      - name: Enforce the development startup budget
        run: pnpm test:startup:run

      - name: Run portable tests
        run: pnpm test:portable

      - name: Run host integration tests
        timeout-minutes: 30
        run: pnpm test:integration

      - name: Run native addon tests
        run: pnpm test:native

      - name: Build and relocation-test both Windows SEA executables
        env:
          SAGEJS_BUILD_JOBS: "8"
        run: pnpm test:sea

      - name: Package the explicitly unsigned Windows x64 SEA distribution
        shell: pwsh
        run: |
          $release = "build/release/sagejs-windows-x64"
          New-Item -ItemType Directory -Force "$release/licenses" | Out-Null
          Copy-Item build/sea/sagejs.exe,build/sea/sagepython.exe $release
          Copy-Item LICENSE,README.md,DISTRIBUTION.md $release
          Copy-Item licenses/* "$release/licenses"
          foreach ($executable in "sagejs.exe", "sagepython.exe") {
            $signature = Get-AuthenticodeSignature "$release/$executable"
            if ($signature.Status -ne "NotSigned") {
              throw "$executable must be unsigned, got $($signature.Status)"
            }
          }
          @'
          These Windows executables are not Authenticode-signed.
          Verify the published SHA-256 checksum before running them.
          '@ | Set-Content "$release/UNSIGNED-WINDOWS.txt"
          $version = (& node -p "require('./package.json').version").Trim()
          $sourceCommit = (& git rev-parse HEAD).Trim()
          if ($env:GITHUB_SHA -and $sourceCommit -ne $env:GITHUB_SHA) {
            throw "Windows source $sourceCommit does not match workflow $env:GITHUB_SHA"
          }
          @{
            schema = "sagejs.windows-release-manifest-v1"
            target = "windows-x64"
            version = $version
            sourceCommit = $sourceCommit
            signature = @{ scheme = "authenticode"; status = "unsigned" }
          } | ConvertTo-Json -Depth 3 | Set-Content "$release/release.json"
          $archive = "build/release/sagejs-windows-x64-unsigned.zip"
          Compress-Archive -Path "$release/*" -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() +
            "  sagejs-windows-x64-unsigned.zip" |
            Set-Content "$archive.sha256"

      - name: Upload Windows x64 SEA artifacts
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sagejs-windows-x64-unsigned
          path: |
            build/release/sagejs-windows-x64-unsigned.zip
            build/release/sagejs-windows-x64-unsigned.zip.sha256
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS arm64 native, tests, and SEA
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 120

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install native build prerequisites
        run: |
          brew untap aws/tap || true
          brew install autoconf automake cmake libtool m4 ninja xz

      - name: Materialize the exact official Node SEA authority
        run: |
          filename=node-v26.7.0-darwin-arm64.tar.xz
          sha256=595d2f934e081b82961d1a5fd41c6dbd0c5a952d9e8be5b4566ab754426968d2
          url="https://nodejs.org/dist/v26.7.0/$filename"
          archive="$RUNNER_TEMP/$filename"
          destination="$RUNNER_TEMP/official-node-26.7.0"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$url"
          printf '%s  %s\n' "$sha256" "$archive" | shasum -a 256 -c -
          mkdir -p "$destination"
          tar -xJf "$archive" -C "$destination"
          sea_node="$destination/node-v26.7.0-darwin-arm64/bin/node"
          [[ "$(uname -m)" == arm64 ]]
          [[ -f "$sea_node" && ! -L "$sea_node" && -x "$sea_node" ]]
          [[ "$("$sea_node" --version)" == v26.7.0 ]]
          [[ "$(lipo -archs "$sea_node")" == arm64 ]]
          unexpected_libraries="$(
            otool -L "$sea_node" | tail -n +2 | awk '{print $1}' |
              grep -Ev '^(/usr/lib/|/System/Library/)' || true
          )"
          [[ -z "$unexpected_libraries" ]] || {
            echo "Official Node has unexpected dynamic dependencies:" >&2
            printf '%s\n' "$unexpected_libraries" >&2
            exit 1
          }
          {
            echo "SAGEJS_SEA_NODE=$sea_node"
            echo "SAGEJS_SEA_NODE_SOURCE_FILENAME=$filename"
            echo "SAGEJS_SEA_NODE_SOURCE_SHA256=$sha256"
            echo "SAGEJS_SEA_NODE_SOURCE_URL=$url"
            echo "SAGEJS_SEA_NODE_SOURCE_VERSION=26.7.0"
          } >> "$GITHUB_ENV"

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Cache downloaded and compiled arithmetic dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: macos-arm64-flint-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: |
            macos-arm64-flint-
            macos-arm64-native-

      - name: Cache downloaded and compiled graph dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/graph/.native/downloads
            packages/graph/.native/prefix
          key: macos-arm64-graph-${{ hashFiles('packages/graph/scripts/build-deps.cjs', 'packages/graph/package.json') }}
          restore-keys: macos-arm64-graph-

      - name: Cache downloaded and compiled FFLAS dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/fflas/.native/downloads
            packages/fflas/.native/prefix
          key: macos-arm64-fflas-${{ hashFiles('packages/fflas/scripts/build-deps.cjs', 'packages/fflas/scripts/native-prefix.cjs', 'packages/fflas/package.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp') }}
          restore-keys: macos-arm64-fflas-

      - name: Cache downloaded and compiled M4RI dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            packages/m4ri/.native/downloads
            packages/m4ri/.native/prefix
          key: macos-arm64-m4ri-${{ hashFiles('packages/m4ri/scripts/build-deps.cjs', 'packages/m4ri/package.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json') }}
          restore-keys: macos-arm64-m4ri-

      - name: Build the compiler and native mathematics stack
        env:
          SAGEJS_BUILD_JOBS: "6"
        run: |
          pnpm --dir packages/flint build
          pnpm --dir packages/fflas build
          pnpm --dir packages/graph build
          pnpm --dir packages/m4ri build
          pnpm build

      - name: Enforce the development startup budget
        run: pnpm test:startup:run

      - name: Run portable, host integration, and native tests
        run: |
          pnpm test:portable
          pnpm test:integration
          pnpm test:native

      - name: Build and relocation-test both macOS SEA executables
        env:
          SAGEJS_BUILD_JOBS: "6"
        run: |
          pnpm run build:zeromq:darwin
          pnpm test:sea

  macos-arm64-first-party-rehearsal:
    name: First-party macOS arm64 release rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Check out the exact rehearsal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0

      - name: Install native build prerequisites
        run: |
          brew untap aws/tap || true
          brew install autoconf automake cmake libtool m4 ninja xz

      - name: Materialize the exact official Node SEA authority
        run: |
          filename=node-v26.7.0-darwin-arm64.tar.xz
          sha256=595d2f934e081b82961d1a5fd41c6dbd0c5a952d9e8be5b4566ab754426968d2
          url="https://nodejs.org/dist/v26.7.0/$filename"
          archive="$RUNNER_TEMP/$filename"
          destination="$RUNNER_TEMP/official-node-26.7.0"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$url"
          printf '%s  %s\n' "$sha256" "$archive" | shasum -a 256 -c -
          mkdir -p "$destination"
          tar -xJf "$archive" -C "$destination"
          sea_node="$destination/node-v26.7.0-darwin-arm64/bin/node"
          [[ "$(uname -m)" == arm64 ]]
          [[ -f "$sea_node" && ! -L "$sea_node" && -x "$sea_node" ]]
          [[ "$("$sea_node" --version)" == v26.7.0 ]]
          [[ "$(lipo -archs "$sea_node")" == arm64 ]]
          unexpected_libraries="$(
            otool -L "$sea_node" | tail -n +2 | awk '{print $1}' |
              grep -Ev '^(/usr/lib/|/System/Library/)' || true
          )"
          [[ -z "$unexpected_libraries" ]] || {
            echo "Official Node has unexpected dynamic dependencies:" >&2
            printf '%s\n' "$unexpected_libraries" >&2
            exit 1
          }
          {
            echo "SAGEJS_SEA_NODE=$sea_node"
            echo "SAGEJS_SEA_NODE_SOURCE_FILENAME=$filename"
            echo "SAGEJS_SEA_NODE_SOURCE_SHA256=$sha256"
            echo "SAGEJS_SEA_NODE_SOURCE_URL=$url"
            echo "SAGEJS_SEA_NODE_SOURCE_VERSION=26.7.0"
          } >> "$GITHUB_ENV"

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and package a credential-free candidate
        env:
          SAGEJS_BUILD_JOBS: "3"
        run: |
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]] || exit 1
          df -h .
          pnpm run build:zeromq:darwin
          pnpm test:sea
          pnpm release:macos --unsigned --skip-build
          node - <<'NODE'
          const { preflightArchive } = require("./scripts/release-artifact-acceptance.cjs");
          const members = preflightArchive(
            "build/release/sagejs-macos-arm64.zip",
            "macos-arm64",
          );
          console.log(`Accepted production ZIP structure with ${members.length} members.`);
          NODE
          df -h .

      - name: Upload the non-publishable rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sagejs-macos-arm64-first-party-rehearsal
          path: |
            build/release/sagejs-macos-arm64.zip
            build/release/sagejs-macos-arm64.zip.sha256
            build/release/sagejs-macos-arm64-benchmark.json
            build/release/sagejs-macos-arm64-benchmark.json.sha256
          if-no-files-found: error
          retention-days: 2

  sign-macos-arm64:
    name: Sign and notarize macOS arm64 release
    if: needs.release-tag-policy.outputs.candidate == 'true'
    needs:
      - release-tag-policy
      - macos-arm64
    runs-on: macos-15
    timeout-minutes: 180
    environment: sagejs-signing
    outputs:
      release-artifact-id: ${{ steps.upload-release.outputs.artifact-id }}
      release-artifact-digest: ${{ steps.upload-release.outputs.artifact-digest }}
    permissions:
      contents: read

    steps:
      - name: Check out the exact tagged Sage.js source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0

      - name: Bind protected signing to the exact tag and package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$GITHUB_REF_TYPE" == tag ]] || {
            echo "Protected macOS signing requires a tag event" >&2
            exit 1
          }
          commit="$(git rev-parse 'HEAD^{commit}')"
          tag_commit="$(git rev-parse "$GITHUB_REF^{commit}")"
          [[ "$commit" == "$GITHUB_SHA" && "$tag_commit" == "$GITHUB_SHA" ]] || {
            echo "Protected macOS checkout, tag, and workflow source differ" >&2
            exit 1
          }
          release_tag="${TAG%-rc.*}"
          node scripts/check-release.cjs --tag "$release_tag"

      - name: Install native build prerequisites on the trusted runner
        run: |
          brew untap aws/tap || true
          brew install autoconf automake cmake libtool m4 ninja xz

      - name: Materialize the exact official Node SEA authority
        run: |
          filename=node-v26.7.0-darwin-arm64.tar.xz
          sha256=595d2f934e081b82961d1a5fd41c6dbd0c5a952d9e8be5b4566ab754426968d2
          url="https://nodejs.org/dist/v26.7.0/$filename"
          archive="$RUNNER_TEMP/$filename"
          destination="$RUNNER_TEMP/official-node-26.7.0"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" "$url"
          printf '%s  %s\n' "$sha256" "$archive" | shasum -a 256 -c -
          mkdir -p "$destination"
          tar -xJf "$archive" -C "$destination"
          sea_node="$destination/node-v26.7.0-darwin-arm64/bin/node"
          [[ "$(uname -m)" == arm64 ]]
          [[ -f "$sea_node" && ! -L "$sea_node" && -x "$sea_node" ]]
          [[ "$("$sea_node" --version)" == v26.7.0 ]]
          [[ "$(lipo -archs "$sea_node")" == arm64 ]]
          unexpected_libraries="$(
            otool -L "$sea_node" | tail -n +2 | awk '{print $1}' |
              grep -Ev '^(/usr/lib/|/System/Library/)' || true
          )"
          [[ -z "$unexpected_libraries" ]] || {
            echo "Official Node has unexpected dynamic dependencies:" >&2
            printf '%s\n' "$unexpected_libraries" >&2
            exit 1
          }
          {
            echo "SAGEJS_SEA_NODE=$sea_node"
            echo "SAGEJS_SEA_NODE_SOURCE_FILENAME=$filename"
            echo "SAGEJS_SEA_NODE_SOURCE_SHA256=$sha256"
            echo "SAGEJS_SEA_NODE_SOURCE_URL=$url"
            echo "SAGEJS_SEA_NODE_SOURCE_VERSION=26.7.0"
          } >> "$GITHUB_ENV"

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Build and test the exact to-be-signed SEA bytes
        env:
          SAGEJS_BUILD_JOBS: "3"
        run: |
          [[ "$(git rev-parse 'HEAD^{commit}')" == "$GITHUB_SHA" ]] || {
            echo "Protected macOS build checkout differs from $GITHUB_SHA" >&2
            exit 1
          }
          pnpm run build:zeromq:darwin
          pnpm test:sea

      - name: Import Apple release credentials
        id: apple-credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.SAGEJS_APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.SAGEJS_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.SAGEJS_APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.SAGEJS_APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.SAGEJS_APPLE_NOTARY_ISSUER_ID }}
        run: |
          for value in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD \
            APPLE_NOTARY_KEY APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            [[ -n "${!value}" ]] || { echo "Missing $value" >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/sagejs-developer-id.p12"
          api_key="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          keychain="$RUNNER_TEMP/sagejs-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "certificate=$certificate" >> "$GITHUB_OUTPUT"
          echo "api_key=$api_key" >> "$GITHUB_OUTPUT"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_CERTIFICATE_P12, "base64"))' \
            "$certificate"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_NOTARY_KEY, "base64"))' \
            "$api_key"
          chmod 0600 "$certificate" "$api_key"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          application_identity='Developer ID Application: William STEIN (BVF94G2MB4)'
          installer_identity='Developer ID Installer: William STEIN (BVF94G2MB4)'
          identities="$(security find-identity -v "$keychain")"
          grep -Fq -- "$application_identity" <<< "$identities" || {
            echo "P12 does not contain the required Developer ID Application identity" >&2
            exit 1
          }
          grep -Fq -- "$installer_identity" <<< "$identities" || {
            echo "P12 does not contain the required Developer ID Installer identity" >&2
            exit 1
          }
          {
            echo "SAGEJS_MACOS_SIGN_ID=$application_identity"
            echo "SAGEJS_MACOS_INSTALLER_ID=$installer_identity"
          } >> "$GITHUB_ENV"
          xcrun notarytool store-credentials sagejs-ci-notary \
            --key "$api_key" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID"

      - name: Sign, notarize, and package macOS arm64
        env:
          SAGEJS_MACOS_NOTARY_PROFILE: sagejs-ci-notary
        run: pnpm release:macos --skip-build

      - name: Remove temporary Apple signing material
        if: always() && steps.apple-credentials.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.apple-credentials.outputs.keychain }}
          CERTIFICATE: ${{ steps.apple-credentials.outputs.certificate }}
          API_KEY: ${{ steps.apple-credentials.outputs.api_key }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$CERTIFICATE" "$API_KEY"

      - name: Accept the exact signed and notarized macOS candidate
        run: |
          version="$(node -p 'require("./package.json").version')"
          commit="$(git rev-parse 'HEAD^{commit}')"
          [[ "$commit" == "$GITHUB_SHA" ]] || {
            echo "macOS acceptance checkout differs from $GITHUB_SHA" >&2
            exit 1
          }
          node scripts/release-artifact-acceptance.cjs \
            --target macos-arm64 \
            --archive build/release/sagejs-macos-arm64.zip \
            --checksum build/release/sagejs-macos-arm64.zip.sha256 \
            --package build/release/sagejs-macos-arm64.pkg \
            --package-checksum build/release/sagejs-macos-arm64.pkg.sha256 \
            --benchmark build/release/sagejs-macos-arm64-benchmark.json \
            --benchmark-checksum build/release/sagejs-macos-arm64-benchmark.json.sha256 \
            --output build/release/sagejs-macos-arm64-acceptance.json \
            --expected-version "$version" \
            --expected-commit "$commit" \
            --signature apple-developer-id \
            --maximum-macos 13.5

      - name: Upload signed macOS arm64 artifacts
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sagejs-macos-arm64
          path: |
            build/release/sagejs-macos-arm64.zip
            build/release/sagejs-macos-arm64.zip.sha256
            build/release/sagejs-macos-arm64.pkg
            build/release/sagejs-macos-arm64.pkg.sha256
            build/release/sagejs-macos-arm64-benchmark.json
            build/release/sagejs-macos-arm64-benchmark.json.sha256
            build/release/sagejs-macos-arm64-acceptance.json
            build/release/sagejs-macos-arm64-acceptance.json.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish the stable GitHub binary release
    if: needs.release-tag-policy.outputs.publish == 'true'
    needs:
      - release-tag-policy
      - linux-x64
      - linux-arm64
      - windows-x64
      - sign-macos-arm64
    runs-on: ubuntu-24.04
    environment: sagejs-release
    permissions:
      contents: write

    steps:
      - name: Check out the exact stable tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.7.0

      - name: Download the exact Linux x64 release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.linux-x64.outputs.release-artifact-id }}
          path: release-input/linux-x64
          merge-multiple: true

      - name: Download the exact Linux arm64 release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.linux-arm64.outputs.release-artifact-id }}
          path: release-input/linux-arm64
          merge-multiple: true

      - name: Download the exact unsigned Windows x64 release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.windows-x64.outputs.release-artifact-id }}
          path: release-input/windows-x64
          merge-multiple: true

      - name: Download the exact signed macOS arm64 release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-macos-arm64.outputs.release-artifact-id }}
          path: release-input/macos-arm64
          merge-multiple: true

      - name: Verify identities and assemble the publication set
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || {
            echo "Checked-out tag does not resolve to $GITHUB_SHA" >&2
            exit 1
          }
          node scripts/check-release.cjs --tag "$TAG"
          node scripts/prepare-release-publication.cjs \
            --input release-input \
            --output publication \
            --tag "$TAG" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-artifact \
              "linux-x64=${{ needs.linux-x64.outputs.release-artifact-id }}:${{ needs.linux-x64.outputs.release-artifact-digest }}" \
            --source-artifact \
              "linux-arm64=${{ needs.linux-arm64.outputs.release-artifact-id }}:${{ needs.linux-arm64.outputs.release-artifact-digest }}" \
            --source-artifact \
              "windows-x64=${{ needs.windows-x64.outputs.release-artifact-id }}:${{ needs.windows-x64.outputs.release-artifact-digest }}" \
            --source-artifact \
              "macos-arm64=${{ needs.sign-macos-arm64.outputs.release-artifact-id }}:${{ needs.sign-macos-arm64.outputs.release-artifact-digest }}"
          (cd publication/assets && sha256sum -c SHA256SUMS)

      - name: Write the human release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Stable release notes require a stable version tag: $TAG" >&2
            exit 1
          }
          printf '# Sage.js %s\n\n' "$TAG" > publication/release-notes.md
          cat >> publication/release-notes.md <<'EOF'
          This hardened, provenance-tracked Sage.js release provides open,
          portable, high-performance software for research mathematics. It
          contains the latest exact arithmetic, polynomial, matrix, graph,
          number-theory, compiler, and Sage-compatible runtime work from the
          tagged commit.

          ## Supported binaries

          - **Linux x64:** glibc 2.28 or newer.
          - **Linux arm64:** Armv8-A, glibc 2.28 or newer.
          - **Apple Silicon macOS:** macOS 13.5 or newer; Developer ID signed
            and Apple-notarized ZIP and PKG.
          - **Windows x64:** Windows 10/11; **not Authenticode-signed in this
            release**. Verify its SHA-256 checksum before running it.

          Every archive contains both the native-mathematics `sagejs`
          executable and the lightweight `sagepython` runtime. No external
          Node.js, Python, compiler, or Sage.js checkout is required.

          Verify downloads with the adjacent `.sha256` files or the consolidated
          `SHA256SUMS`. `release-provenance.json` binds every published file to
          this commit and to the immutable GitHub Actions artifact IDs/digests.

          This early release does not include Intel macOS, a signed Windows
          executable, or npm publication. See the implementation dashboard for
          the current Sage compatibility surface and known limitations.
          EOF

      - name: Create a private draft containing only the validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          mapfile -t assets < <(find publication/assets -maxdepth 1 -type f -print | sort)
          [[ ${#assets[@]} -ge 4 ]] || { echo "Incomplete release asset set" >&2; exit 1; }
          gh release create "$TAG" \
            --draft \
            --verify-tag \
            --title "Sage.js $TAG" \
            --notes-file publication/release-notes.md \
            "${assets[@]}"

      - name: Publish the complete stable release atomically from draft state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest

      - name: Verify the immutable public release and every asset digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          release_json="$RUNNER_TEMP/sagejs-published-release.json"
          latest_json="$RUNNER_TEMP/sagejs-latest-release.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$release_json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/latest" > "$latest_json"
          node - publication/assets "$TAG" "$release_json" "$latest_json" <<'NODE'
          const assert = require("node:assert/strict");
          const { createHash } = require("node:crypto");
          const { readFileSync, readdirSync, statSync } = require("node:fs");
          const { join } = require("node:path");
          const directory = process.argv[2];
          const tag = process.argv[3];
          const release = JSON.parse(readFileSync(process.argv[4], "utf8"));
          const latest = JSON.parse(readFileSync(process.argv[5], "utf8"));
          assert.equal(release.tag_name, tag);
          assert.equal(release.draft, false);
          assert.equal(release.prerelease, false);
          assert.equal(release.immutable, true);
          assert.equal(latest.tag_name, tag, "published release is not GitHub latest");
          const local = readdirSync(directory).sort();
          const remote = [...release.assets].sort((left, right) =>
            left.name.localeCompare(right.name),
          );
          assert.deepEqual(remote.map(({ name }) => name), local);
          for (const asset of remote) {
            const filename = join(directory, asset.name);
            const digest = createHash("sha256")
              .update(readFileSync(filename))
              .digest("hex");
            assert.equal(asset.state, "uploaded", `${asset.name} upload state`);
            assert.equal(asset.size, statSync(filename).size, `${asset.name} size`);
            assert.equal(asset.digest, `sha256:${digest}`, `${asset.name} digest`);
          }
          NODE
