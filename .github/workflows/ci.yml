name: Sage.js CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sagejs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    name: Linux x64 native, tests, and SEA
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential python3 m4 xz-utils

      - name: Cache downloaded and compiled native dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: linux-x64-native-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'pnpm-lock.yaml') }}

      - name: Bootstrap the complete native system
        env:
          SAGEJS_BUILD_JOBS: "4"
        run: pnpm bootstrap

      - name: Validate parallel project contracts
        run: pnpm parallel:check -- --all

      - name: Run strict baselib checks
        run: pnpm test:baselib:strict

      - name: Run compiler compatibility diagnostics
        id: compiler
        continue-on-error: true
        run: pnpm test:compiler

      - name: Run unit, host integration, and native tests
        run: |
          pnpm test:unit
          pnpm test:integration
          pnpm test:native

      - name: Run Sage tutorial compatibility diagnostics
        id: tutorial
        continue-on-error: true
        run: pnpm test:tutorial

      - name: Build and relocation-test both SEA executables
        env:
          SAGEJS_BUILD_JOBS: "4"
        run: pnpm test:sea

      - name: Record non-blocking compatibility status
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Compatibility diagnostics

          | Suite | Outcome |
          | --- | --- |
          | Compiler corpus | **${{ steps.compiler.outcome }}** |
          | Sage tutorial | **${{ steps.tutorial.outcome }}** |

          These broad compatibility suites already contain failures on the
          baseline that introduced CI. They remain visible and non-blocking
          while those existing failures are triaged; bootstrap, strict baselib,
          unit, host integration, native, and SEA tests are blocking.
          EOF

      - name: Package the Linux x64 SEA distribution
        run: |
          mkdir -p build/release/sagejs-linux-x64/licenses
          cp build/sea/sagejs build/sea/sagepython build/release/sagejs-linux-x64/
          cp LICENSE README.md DISTRIBUTION.md build/release/sagejs-linux-x64/
          cp licenses/* build/release/sagejs-linux-x64/licenses/
          tar -C build/release -cJf build/release/sagejs-linux-x64.tar.xz sagejs-linux-x64
          cd build/release
          sha256sum sagejs-linux-x64.tar.xz > sagejs-linux-x64.tar.xz.sha256

      - name: Upload Linux x64 SEA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sagejs-linux-x64
          path: |
            build/release/sagejs-linux-x64.tar.xz
            build/release/sagejs-linux-x64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14

  linux-arm64:
    name: Linux arm64 native, tests, and SEA
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install the native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential python3 m4 xz-utils

      - name: Cache downloaded and compiled native dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: linux-arm64-native-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'packages/flint/binding.gyp', 'pnpm-lock.yaml') }}

      - name: Bootstrap the complete native system
        env:
          SAGEJS_BUILD_JOBS: "4"
        run: pnpm bootstrap

      - name: Run strict baselib checks
        run: pnpm test:baselib:strict

      - name: Run unit, host integration, and native tests
        run: |
          pnpm test:unit
          pnpm test:integration
          pnpm test:native

      - name: Build and relocation-test both SEA executables
        env:
          SAGEJS_BUILD_JOBS: "4"
        run: pnpm test:sea

      - name: Package the Linux arm64 SEA distribution
        run: |
          mkdir -p build/release/sagejs-linux-arm64/licenses
          cp build/sea/sagejs build/sea/sagepython build/release/sagejs-linux-arm64/
          cp LICENSE README.md DISTRIBUTION.md build/release/sagejs-linux-arm64/
          cp licenses/* build/release/sagejs-linux-arm64/licenses/
          tar -C build/release -cJf build/release/sagejs-linux-arm64.tar.xz sagejs-linux-arm64
          cd build/release
          sha256sum sagejs-linux-arm64.tar.xz > sagejs-linux-arm64.tar.xz.sha256

      - name: Upload Linux arm64 SEA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sagejs-linux-arm64
          path: |
            build/release/sagejs-linux-arm64.tar.xz
            build/release/sagejs-linux-arm64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14

  windows-x64:
    name: Windows x64 native, tests, and SEA
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install Python for node-gyp
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Cache vcpkg and compiled native dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/flint/.native/vcpkg
            packages/flint/.native/vcpkg-installed
          key: windows-x64-native-${{ hashFiles('packages/flint/vcpkg.json', 'packages/flint/scripts/build-deps.cjs', 'packages/flint/scripts/triplets/*.cmake', 'packages/flint/binding.gyp', 'pnpm-lock.yaml') }}

      - name: Build the compiler and native mathematics stack
        env:
          SAGEJS_BUILD_JOBS: "4"
        run: |
          pnpm --dir packages/flint build
          pnpm build

      - name: Run portable, host integration, and native tests
        run: |
          pnpm test:portable
          pnpm test:integration
          pnpm test:native

      - name: Build and relocation-test both Windows SEA executables
        env:
          SAGEJS_BUILD_JOBS: "4"
        run: pnpm test:sea

      - name: Package the Windows x64 SEA distribution
        shell: pwsh
        run: |
          $release = "build/release/sagejs-windows-x64"
          New-Item -ItemType Directory -Force "$release/licenses" | Out-Null
          Copy-Item build/sea/sagejs.exe,build/sea/sagepython.exe $release
          Copy-Item LICENSE,README.md,DISTRIBUTION.md $release
          Copy-Item licenses/* "$release/licenses"
          Compress-Archive -Path "$release/*" -DestinationPath "build/release/sagejs-windows-x64.zip"
          (Get-FileHash "build/release/sagejs-windows-x64.zip" -Algorithm SHA256).Hash.ToLower() +
            "  sagejs-windows-x64.zip" |
            Set-Content "build/release/sagejs-windows-x64.zip.sha256"

      - name: Upload Windows x64 SEA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sagejs-windows-x64
          path: |
            build/release/sagejs-windows-x64.zip
            build/release/sagejs-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    name: macOS arm64 native, tests, and SEA
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out Sage.js and its test corpora
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.5.1
          cache: pnpm

      - name: Install native build prerequisites
        run: brew install m4 xz

      - name: Install the pinned dependency graph
        run: pnpm install --frozen-lockfile

      - name: Cache downloaded and compiled native dependencies
        uses: actions/cache@v4
        with:
          path: |
            packages/flint/.native/downloads
            packages/flint/.native/prefix
          key: macos-arm64-native-${{ hashFiles('packages/flint/scripts/build-deps.cjs', 'packages/flint/package.json', 'pnpm-lock.yaml') }}

      - name: Build the compiler and native mathematics stack
        env:
          SAGEJS_BUILD_JOBS: "3"
        run: |
          pnpm --dir packages/flint build
          pnpm build

      - name: Run portable, host integration, and native tests
        run: |
          pnpm test:portable
          pnpm test:integration
          pnpm test:native

      - name: Build and relocation-test both macOS SEA executables
        env:
          SAGEJS_BUILD_JOBS: "3"
        run: pnpm test:sea

  publish-release:
    name: Publish tagged SEA release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - linux-x64
      - linux-arm64
      - windows-x64
      - macos-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download the validated release artifacts
        uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" release/* --clobber
