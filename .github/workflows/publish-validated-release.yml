name: Request prepared release publication or recovery

on:
  workflow_dispatch:
    inputs:
      prepared_request:
        description: Exact frozen artifact and macOS inspection request JSON
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  request:
    name: Request prepared publication through the npm-trusted CI workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
      - name: Install request validation dependencies without building products
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Dispatch the exact prepared request to the trusted CI workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARED_REQUEST: ${{ inputs.prepared_request }}
        run: node scripts/release/request-prepared-publication.cjs
