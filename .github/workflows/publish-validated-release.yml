name: Request validated release publication recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed tagged Sage.js CI run whose publisher should be rerun
        required: true
        type: string
      release_tag:
        description: Immutable release tag built by source_run_id
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  request:
    name: Request recovery through the npm-trusted CI workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the trusted CI workflow at the exact release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "source_run_id must be a positive Actions run ID" >&2
            exit 1
          }
          [[ "$RELEASE_TAG" == v* ]] || {
            echo "release_tag must be a release tag" >&2
            exit 1
          }
          gh workflow run .github/workflows/ci.yml \
            --repo "$GH_REPO" \
            --ref "$RELEASE_TAG" \
            -f recovery_run_id="$SOURCE_RUN_ID" \
            -f recovery_tag="$RELEASE_TAG" \
            -f platform_smoke=false \
            -f native_targets=all
