name: Sage.js WebAssembly routine parity

on:
  pull_request:
    paths:
      - "packages/flint-wasm/**"
      - "packages/wasm-toolchain/**"
      - "packages/flint/src/**"
      - "src/**"
      - "ffi/**"
      - "tools/ffi/**"
      - "tools/native-kernel/**"
      - "tools/source-mirror/**"
      - "test/browser-wasm-*"
      - "bench/browser-wasm-*"
      - ".github/workflows/wasm*.yml"
  push:
    branches: [main]
    paths:
      - "packages/flint-wasm/**"
      - "packages/wasm-toolchain/**"
      - "packages/flint/src/**"
      - "src/**"
      - "ffi/**"
      - "tools/ffi/**"
      - "tools/native-kernel/**"
      - "tools/source-mirror/**"
      - "test/browser-wasm-*"
      - "bench/browser-wasm-*"
      - ".github/workflows/wasm*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-routine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Restore an exact prebuilt Wasm artifact
        id: artifact-cache
        uses: actions/cache@v6
        with:
          path: packages/flint-wasm/dist
          key: >-
            sagejs-wasm-dist-v1-${{ runner.os }}-${{
            hashFiles('pnpm-lock.yaml', 'packages/flint-wasm/**',
            'packages/wasm-toolchain/**', 'tools/source-mirror/**',
            'packages/flint/src/**', 'ffi/**', 'tools/ffi/**',
            'tools/native-kernel/**', 'src/**') }}

      - name: Resolve the pinned toolchain cache
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        id: toolchain
        run: |
          path="$(node packages/wasm-toolchain/scripts/toolchain.cjs cache-path)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "identity=${path##*/}" >> "$GITHUB_OUTPUT"
      - name: Restore the content-addressed Sage.js Wasm toolchain
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.path }}
          key: sagejs-wasm-toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}
      - name: Prepare the pinned toolchain and build the artifact
        if: steps.artifact-cache.outputs.cache-hit != 'true'
        run: |
          node packages/wasm-toolchain/scripts/toolchain.cjs prepare
          node packages/wasm-toolchain/scripts/probe.cjs
          pnpm build
          pnpm --dir packages/flint-wasm build

      - name: Validate content identity and release payload
        run: |
          node packages/flint-wasm/scripts/production-receipt.cjs validate
          node packages/flint-wasm/scripts/browser-wasm-deployment.cjs \
            --headers website/live/_headers
          node packages/flint-wasm/scripts/browser-wasm-release-artifact.cjs \
            --budget bench/browser-wasm-budget.json \
            --output build/wasm-routine-artifact.json
          node --test \
            test/browser-wasm-release-gates.cjs \
            packages/flint-wasm/test/browser-wasm-wasi-quota.test.mjs

      - name: Install Chromium matched to playwright-core
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Run mandatory public worker parity
        run: |
          node packages/flint-wasm/test/browser-wasm-parity.mjs \
            --tier routine --engines chromium --require-engines chromium \
            --receipt build/wasm-routine-parity.json
          node packages/flint-wasm/test/browser-wasm-serialization.mjs
          node packages/flint-wasm/test/browser-wasm-security.mjs

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasm-routine-receipts
          path: build/wasm-routine-*.json
          if-no-files-found: error
