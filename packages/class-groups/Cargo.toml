[package]
name = "sagejs-class-groups"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[workspace]
resolver = "2"

[features]
default = ["flint-normal-form"]
flint-normal-form = []

[dependencies]
rug = { version = "1.30", default-features = false, features = ["float", "integer", "rational"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[target.'cfg(target_os = "wasi")'.dependencies]
gmp-mpfr-sys = { version = "=1.7.1", default-features = false, features = ["force-cross", "mpfr", "use-system-libs"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
