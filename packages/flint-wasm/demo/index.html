<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sage.js FLINT WebAssembly</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      main {
        margin: 12vh auto;
        max-width: 54rem;
        padding: 2rem;
      }
      textarea {
        box-sizing: border-box;
        font: inherit;
        min-height: 8rem;
        padding: 0.7rem;
        resize: vertical;
        width: 100%;
      }
      button {
        font: inherit;
        margin-top: 1rem;
        padding: 0.6rem 1rem;
      }
      output {
        display: block;
        margin-top: 2rem;
        overflow-wrap: anywhere;
      }
      #display {
        background: white;
        color: black;
        margin-top: 1rem;
        min-height: 0;
      }
      #display:not(:empty) {
        min-height: 24rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sage.js in a Web Worker</h1>
      <p>
        This compiles and evaluates Sage code locally, with
        arbitrary-precision factorization provided by FLINT WebAssembly.
        Interrupting terminates and replaces the worker.
      </p>
      <label for="source">
        Sage source (press Shift+Enter or Ctrl+Enter to run)
      </label>
      <textarea id="source" spellcheck="false">u, v = var('u v')
wave = plot3d(sin(pi*(u^2 + v^2))/2,
              (u, -1, 1), (v, -1, 1),
              color=['navy', 'cyan', 'yellow'],
              opacity=17/20, mesh=True, frame=False,
              title='Sage.js Symbolic 3D Plotting')
wave + sphere((0, 0, 7/20), size=9/50,
              color='red', opacity=4/5)</textarea>
      <button id="run">Run</button>
      <button id="interrupt" disabled>Interrupt</button>
      <output id="output">Ready.</output>
      <div id="display" aria-live="polite"></div>
    </main>
    <script src="../dist/plotly.min.js"></script>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
