<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sage.js FLINT WebAssembly</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      main {
        margin: 12vh auto;
        max-width: 54rem;
        padding: 2rem;
      }
      textarea {
        box-sizing: border-box;
        font: inherit;
        min-height: 8rem;
        padding: 0.7rem;
        resize: vertical;
        width: 100%;
      }
      button {
        font: inherit;
        margin-top: 1rem;
        padding: 0.6rem 1rem;
      }
      output {
        display: block;
        margin-top: 2rem;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sage.js in a Web Worker</h1>
      <p>
        This compiles and evaluates Sage code locally, with
        arbitrary-precision factorization provided by FLINT WebAssembly.
        Interrupting terminates and replaces the worker.
      </p>
      <label for="source">Sage source</label>
      <textarea id="source" spellcheck="false">for n in [2025..2050]:
    print(factor(n))</textarea>
      <button id="run">Run</button>
      <button id="interrupt" disabled>Interrupt</button>
      <output id="output">Ready.</output>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
