[package]
name = "sagejs-imaginary-quadratic-core"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[workspace]
resolver = "2"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smallvec = { version = "1.15", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
