[package]
name = "sagejs-rust-wasm-public-cubic-e2e"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sagejs-public-cubic-class-group-e2e-qualification = { path = "public-wasm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
