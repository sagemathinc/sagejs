[package]
name = "sagejs-rust-wasm-prepared-relation-prefix"
version = "0.1.0"
edition = "2024"
publish = false

[features]
flint-normal-form = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gmp-mpfr-sys = { version = "=1.5.3", default-features = false, features = ["force-cross", "mpfr", "use-system-libs"] }
rug = { version = "=1.19.2", default-features = false, features = ["float", "integer"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
