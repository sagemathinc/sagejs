[package]
name = "sagejs-pari-class-group-rust-experiment"
version = "0.1.0"
edition = "2024"
publish = false

[features]
flint-normal-form = []

[dependencies]
rug = { version = "1.30", default-features = false, features = ["float", "integer"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
